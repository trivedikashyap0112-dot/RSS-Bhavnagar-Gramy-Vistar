<!DOCTYPE html>
<html lang="gu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Personalised Poster</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mogra&display=swap" rel="stylesheet">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f3f3;
    font-family:Arial,sans-serif;
    color:#222;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:18px;
}

h1{
    text-align:center;
    font-size:24px;
    margin:5px 0 18px;
}

.control-box{
    background:#fff;
    padding:18px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input[type="text"],
input[type="file"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#videoButton{
    background:#e85d04;
    color:white;
}

#imageButton{
    background:#333;
    color:white;
}

button:disabled{
    opacity:.55;
}

.poster-wrapper{
    width:100%;
    background:white;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

#canvas{
    width:100%;
    height:auto;
    display:block;
}

.progress{
    display:none;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.bar{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.fill{
    height:100%;
    width:0%;
    background:#e85d04;
}

.status{
    text-align:center;
    font-size:13px;
    color:#666;
    margin-top:10px;
    line-height:1.5;
}

.note{
    text-align:center;
    font-size:13px;
    color:#777;
    margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<h1>તમારું Personalised Poster બનાવો</h1>

<div class="control-box">

<label>તમારો ફોટો Upload કરો</label>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>

<label>તમારું નામ</label>

<input
    type="text"
    id="nameInput"
    placeholder="તમારું નામ લખો"
>

<label>પ્રવાસમાં જવાનું ગામ</label>

<input
    type="text"
    id="villageInput"
    placeholder="ગામનું નામ લખો"
>

<button id="videoButton">
🎬 Download Poster Video
</button>

<button id="imageButton">
🖼️ Download Poster Image
</button>

<div class="progress" id="progress">

<div id="progressText">
Video તૈયાર થઈ રહ્યું છે...
</div>

<div class="bar">
<div class="fill" id="fill"></div>
</div>

</div>

<div class="status" id="status">
Poster loading...
</div>

<div class="note">
Video માં poster + audio ની સંપૂર્ણ duration રહેશે.
</div>

</div>

<div class="poster-wrapper">

<canvas
    id="canvas"
    width="928"
    height="1640">
</canvas>

</div>

</div>


<script>

/* =====================================================
   BASIC SETTINGS
===================================================== */

const WIDTH = 928;
const HEIGHT = 1640;

const POSTER = "poster.jpg";
const AUDIO = "audio.mp3";


/* =====================================================
   YOUR PHOTO / NAME / VILLAGE POSITIONS
===================================================== */

const PHOTO = {
    x:638,
    y:1290,
    width:270,
    height:270
};

const NAME = {
    x:773,
    y:1615,
    maxWidth:240,
    maxFont:48,
    minFont:25
};

const VILLAGE = {
    x:632,
    y:1095,
    width:280,
    height:45,
    maxFont:35,
    minFont:20,
    color:"#832404"
};


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
    document.getElementById("canvas");

const ctx =
    canvas.getContext("2d");

const photoInput =
    document.getElementById("photoInput");

const nameInput =
    document.getElementById("nameInput");

const villageInput =
    document.getElementById("villageInput");

const videoButton =
    document.getElementById("videoButton");

const imageButton =
    document.getElementById("imageButton");

const progress =
    document.getElementById("progress");

const progressText =
    document.getElementById("progressText");

const fill =
    document.getElementById("fill");

const status =
    document.getElementById("status");


/* =====================================================
   VARIABLES
===================================================== */

let posterImage = null;
let userPhoto = null;


/* =====================================================
   LOAD POSTER
===================================================== */

function loadPoster(){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.onload = ()=>{

            posterImage = img;

            redraw();

            resolve();

        };

        img.onerror = ()=>{

            reject(
                new Error(
                    "poster.jpg could not be loaded."
                )
            );

        };

        img.src =
            POSTER + "?v=" + Date.now();

    });

}


/* =====================================================
   PHOTO
===================================================== */

photoInput.addEventListener(
    "change",
    function(){

        const file = this.files[0];

        if(!file) return;

        if(!file.type.startsWith("image/")){

            alert("Please select an image.");

            return;

        }

        const reader = new FileReader();

        reader.onload = function(e){

            const img = new Image();

            img.onload = function(){

                userPhoto = img;

                redraw();

            };

            img.src = e.target.result;

        };

        reader.readAsDataURL(file);

    }
);


/* =====================================================
   INPUT
===================================================== */

nameInput.addEventListener(
    "input",
    redraw
);

villageInput.addEventListener(
    "input",
    redraw
);


/* =====================================================
   DRAW PHOTO
===================================================== */

function drawPhoto(){

    if(!userPhoto) return;

    const boxX = PHOTO.x;
    const boxY = PHOTO.y;
    const boxW = PHOTO.width;
    const boxH = PHOTO.height;

    const imageRatio =
        userPhoto.width /
        userPhoto.height;

    const boxRatio =
        boxW / boxH;

    let w;
    let h;

    /*
       COVER mode.
       This prevents white space around photo.
    */

    if(imageRatio > boxRatio){

        h = boxH;
        w = h * imageRatio;

    }else{

        w = boxW;
        h = w / imageRatio;

    }

    const x =
        boxX + (boxW - w) / 2;

    const y =
        boxY + (boxH - h) / 2;

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        boxX,
        boxY,
        boxW,
        boxH
    );

    ctx.clip();

    ctx.drawImage(
        userPhoto,
        x,
        y,
        w,
        h
    );

    ctx.restore();

}


/* =====================================================
   DRAW VILLAGE
===================================================== */

function drawVillage(){

    const village =
        villageInput.value.trim();

    if(!village) return;

    ctx.save();

    let size =
        VILLAGE.maxFont;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    while(size > VILLAGE.minFont){

        ctx.font =
            `${size}px "Mogra",Arial,sans-serif`;

        if(
            ctx.measureText(village).width
            <=
            VILLAGE.width
        ){

            break;

        }

        size--;

    }

    ctx.fillStyle =
        VILLAGE.color;

    ctx.shadowColor =
        "rgba(0,0,0,.15)";

    ctx.shadowBlur = 2;

    ctx.fillText(

        village,

        VILLAGE.x +
        VILLAGE.width / 2,

        VILLAGE.y +
        VILLAGE.height / 2

    );

    ctx.restore();

}


/* =====================================================
   DRAW NAME
===================================================== */

function drawName(){

    const name =
        nameInput.value.trim();

    if(!name) return;

    ctx.save();

    let size =
        NAME.maxFont;

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    while(size > NAME.minFont){

        ctx.font =
            `bold ${size}px Arial`;

        if(
            ctx.measureText(name).width
            <=
            NAME.maxWidth
        ){

            break;

        }

        size--;

    }

    ctx.fillStyle =
        "#8f2e0f";

    ctx.shadowColor =
        "rgba(0,0,0,.18)";

    ctx.shadowBlur = 3;

    ctx.fillText(
        name,
        NAME.x,
        NAME.y
    );

    ctx.restore();

}


/* =====================================================
   REDRAW
===================================================== */

function redraw(){

    if(!posterImage) return;

    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );

    ctx.drawImage(
        posterImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );

    drawPhoto();
    drawVillage();
    drawName();

}


/* =====================================================
   DOWNLOAD IMAGE
===================================================== */

imageButton.addEventListener(
    "click",
    function(){

        redraw();

        canvas.toBlob(
            function(blob){

                if(!blob){

                    alert(
                        "Could not create poster."
                    );

                    return;

                }

                downloadFile(
                    blob,
                    "personalised-poster.png"
                );

            },
            "image/png"
        );

    }
);


/* =====================================================
   GET BEST VIDEO FORMAT
===================================================== */

function getVideoMime(){

    if(
        typeof MediaRecorder ===
        "undefined"
    ){

        return null;

    }

    /*
       Safari normally prefers MP4.
    */

    const safariTypes = [

        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

        "video/mp4;codecs=avc1.4D401E,mp4a.40.2",

        "video/mp4"

    ];

    for(const type of safariTypes){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            return {
                mime:type,
                ext:"mp4"
            };

        }

    }


    /*
       Chrome normally uses WebM.
    */

    const chromeTypes = [

        "video/webm;codecs=vp8,opus",

        "video/webm;codecs=vp9,opus",

        "video/webm"

    ];

    for(const type of chromeTypes){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            return {
                mime:type,
                ext:"webm"
            };

        }

    }

    return null;

}


/* =====================================================
   LOAD AUDIO
===================================================== */

async function loadAudio(){

    const response =
        await fetch(
            AUDIO + "?v=" + Date.now()
        );

    if(!response.ok){

        throw new Error(
            "audio.mp3 not found. Put audio.mp3 beside index.html."
        );

    }

    const buffer =
        await response.arrayBuffer();

    const AudioContext =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContext){

        throw new Error(
            "Web Audio is not supported."
        );

    }

    const audioContext =
        new AudioContext();

    const audioBuffer =
        await audioContext.decodeAudioData(
            buffer
        );

    return {
        audioContext,
        audioBuffer
    };

}


/* =====================================================
   CREATE AUDIO
===================================================== */

async function createAudio(){

    const {
        audioContext,
        audioBuffer
    } = await loadAudio();

    const destination =
        audioContext.createMediaStreamDestination();

    const source =
        audioContext.createBufferSource();

    source.buffer =
        audioBuffer;

    source.connect(destination);

    await audioContext.resume();

    return {
        audioContext,
        audioBuffer,
        source,
        destination
    };

}


/* =====================================================
   VIDEO CREATION
===================================================== */

async function createVideo(){

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }

    if(!nameInput.value.trim()){

        alert(
            "Please enter your name."
        );

        return;

    }

    if(!villageInput.value.trim()){

        alert(
            "Please enter village name."
        );

        return;

    }

    const format =
        getVideoMime();

    if(!format){

        alert(
            "Your browser does not support video recording. Please use latest Chrome or Safari."
        );

        return;

    }

    videoButton.disabled = true;
    imageButton.disabled = true;

    progress.style.display = "block";

    fill.style.width = "0%";

    status.innerText =
        "Audio loading...";


    let audio = null;
    let recorder = null;
    let canvasStream = null;
    let animation = null;

    try{

        redraw();


        /* =============================================
           LOAD FULL AUDIO
        ============================================= */

        audio =
            await createAudio();

        const duration =
            audio.audioBuffer.duration;

        status.innerText =
            `Audio duration: ${formatTime(duration)}`;


        /* =============================================
           CANVAS VIDEO STREAM
        ============================================= */

        /*
           IMPORTANT:
           Continuously redraw canvas.
           This fixes the short 4-second video
           problem on some browsers.
        */

        canvasStream =
            canvas.captureStream(30);


        let running = true;

        function animate(){

            if(!running) return;

            redraw();

            animation =
                requestAnimationFrame(
                    animate
                );

        }

        animate();


        /* =============================================
           FINAL STREAM
        ============================================= */

        const finalStream =
            new MediaStream();

        canvasStream
            .getVideoTracks()
            .forEach(track=>{

                finalStream.addTrack(track);

            });

        audio.destination.stream
            .getAudioTracks()
            .forEach(track=>{

                finalStream.addTrack(track);

            });


        /* =============================================
           RECORDER
        ============================================= */

        recorder =
            new MediaRecorder(
                finalStream,
                {
                    mimeType:format.mime,

                    videoBitsPerSecond:
                        2500000,

                    audioBitsPerSecond:
                        128000
                }
            );


        const chunks = [];


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        const stopped =
            new Promise(
                (resolve,reject)=>{

                    recorder.onstop =
                        resolve;

                    recorder.onerror =
                        ()=>{
                            reject(
                                new Error(
                                    "MediaRecorder error."
                                )
                            );
                        };

                }
            );


        /* =============================================
           START RECORDING
        ============================================= */

        recorder.start();


        /*
           Start audio AFTER recorder starts.
           This prevents missing the beginning
           of the audio.
        */

        audio.source.start(0);


        const start =
            performance.now();


        /* =============================================
           WAIT FULL AUDIO DURATION
        ============================================= */

        await new Promise(resolve=>{

            function check(){

                const elapsed =
                    (
                        performance.now()
                        -
                        start
                    ) / 1000;

                const percent =
                    Math.min(
                        100,
                        (elapsed / duration) * 100
                    );

                fill.style.width =
                    percent + "%";

                progressText.innerText =
                    `Video બનાવાઈ રહ્યું છે... ${Math.floor(percent)}%`;

                if(
                    elapsed >= duration
                ){

                    resolve();

                }else{

                    requestAnimationFrame(
                        check
                    );

                }

            }

            check();

        });


        /* =============================================
           STOP
        ============================================= */

        try{

            audio.source.stop();

        }catch(e){}


        running = false;

        if(animation){

            cancelAnimationFrame(
                animation
            );

        }


        recorder.stop();

        await stopped;


        /* =============================================
           FINAL VIDEO
        ============================================= */

        const blob =
            new Blob(
                chunks,
                {
                    type:format.mime
                }
            );


        if(blob.size < 50000){

            throw new Error(
                "Browser returned an incomplete video file. Please try the latest Chrome or Safari."
            );

        }


        fill.style.width =
            "100%";

        progressText.innerText =
            "✅ Video તૈયાર છે";


        status.innerText =
            `Poster + full ${formatTime(duration)} audio તૈયાર છે. Format: ${format.ext.toUpperCase()}`;


        /*
           DOWNLOAD
        */

        downloadVideoFile(
            blob,
            `personalised-poster-video.${format.ext}`
        );


    }
    catch(error){

        console.error(error);

        alert(
            "Video બનાવવામાં error:\n\n" +
            error.message
        );

    }
    finally{

        if(animation){

            cancelAnimationFrame(
                animation
            );

        }

        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    track=>track.stop()
                );

        }

        if(audio){

            try{

                await audio.audioContext.close();

            }catch(e){}

        }

        videoButton.disabled = false;
        imageButton.disabled = false;

        setTimeout(()=>{

            progress.style.display =
                "none";

        },3000);

    }

}


/* =====================================================
   DOWNLOAD
===================================================== */

function downloadFile(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = filename;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        10000
    );

}


/* =====================================================
   VIDEO DOWNLOAD
   Safari fallback included
===================================================== */

function downloadVideoFile(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download = filename;

    a.rel = "noopener";

    document.body.appendChild(a);


    /*
       Try normal download.
    */

    a.click();

    a.remove();


    /*
       Safari/iPhone fallback.

       If Safari doesn't automatically
       save the Blob, open the video.
       User can then use Share → Save Video.
    */

    setTimeout(()=>{

        if(
            /Safari/i.test(navigator.userAgent) &&
            !/Chrome/i.test(navigator.userAgent)
        ){

            const openVideo =
                confirm(
                    "Safari એ automatic download ન કર્યું હોય તો OK દબાવો અને video ને Save Video કરો."
                );

            if(openVideo){

                window.open(
                    url,
                    "_blank"
                );

            }

        }

    },1200);


    setTimeout(
        ()=>{
            URL.revokeObjectURL(url);
        },
        60000
    );

}


/* =====================================================
   TIME
===================================================== */

function formatTime(seconds){

    const minutes =
        Math.floor(seconds / 60);

    const secs =
        Math.floor(seconds % 60);

    return (
        String(minutes).padStart(2,"0")
        +
        ":"
        +
        String(secs).padStart(2,"0")
    );

}


/* =====================================================
   VIDEO BUTTON
===================================================== */

videoButton.addEventListener(
    "click",
    createVideo
);


/* =====================================================
   START
===================================================== */

(async function(){

    try{

        await loadPoster();

        const format =
            getVideoMime();

        if(format){

            status.innerText =
                `Ready • ${format.ext.toUpperCase()} video supported`;

        }else{

            status.innerText =
                "Video recording not supported.";

        }

    }
    catch(error){

        console.error(error);

        status.innerText =
            error.message;

        alert(error.message);

    }

})();

</script>

</body>
</html>
