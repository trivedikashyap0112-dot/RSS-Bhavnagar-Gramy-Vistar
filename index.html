<!DOCTYPE html>
<html lang="gu">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Personalised Poster</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mogra&display=swap"
      rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f3f3f3;
    color:#222;
    font-family:Arial,sans-serif;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:18px;
}

h1{
    text-align:center;
    font-size:24px;
    margin:5px 0 18px;
}

.control-box{
    background:#fff;
    padding:18px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input[type="file"],
input[type="text"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#downloadVideo{
    background:#e85d04;
    color:#fff;
}

#downloadPoster{
    background:#333;
    color:#fff;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.poster-wrapper{
    width:100%;
    background:#fff;
    overflow:hidden;
    border-radius:5px;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

#posterCanvas{
    width:100%;
    height:auto;
    display:block;
}

.progress{
    display:none;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.progress-bar{
    width:100%;
    height:10px;
    margin-top:8px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#e85d04;
}

.status{
    margin-top:10px;
    text-align:center;
    font-size:13px;
    color:#555;
}

.note{
    margin-top:10px;
    text-align:center;
    font-size:13px;
    color:#666;
    line-height:1.5;
}

.preview-video{
    width:100%;
    display:none;
    margin-top:15px;
    border-radius:8px;
    background:#000;
}

</style>

</head>


<body>


<div class="container">


<h1>
તમારું Personalised Poster બનાવો
</h1>


<div class="control-box">


<label>
તમારો ફોટો Upload કરો
</label>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>


<label>
તમારું નામ
</label>

<input
    type="text"
    id="nameInput"
    placeholder="તમારું નામ લખો"
>


<label>
પ્રવાસમાં જવાનું ગામ
</label>

<input
    type="text"
    id="villageInput"
    placeholder="ગામનું નામ લખો"
>


<button
    id="downloadVideo">

🎬 Poster + Audio Video બનાવો

</button>


<button
    id="downloadPoster">

🖼️ Download Poster Image

</button>


<div
    class="progress"
    id="progressBox">

    <div id="progressText">
        Video તૈયાર થઈ રહ્યું છે...
    </div>

    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progressFill">
        </div>

    </div>

</div>


<div
    class="status"
    id="status">
</div>


<div class="note">

Video માં poster સાથે audio ના પ્રથમ 30 seconds રહેશે.

</div>


<video
    id="previewVideo"
    class="preview-video"
    controls
    playsinline>
</video>


</div>


<div class="poster-wrapper">

<canvas
    id="posterCanvas"
    width="928"
    height="1640">
</canvas>

</div>


</div>


<script>

/* =====================================================
   SETTINGS
===================================================== */

const WIDTH = 928;

const HEIGHT = 1640;

const VIDEO_DURATION = 30;

const FPS = 24;


/* =====================================================
   FILES
===================================================== */

const POSTER_FILE = "poster.jpg";

const AUDIO_FILE = "audio.mp3";


/* =====================================================
   PHOTO POSITION
===================================================== */

const PHOTO_BOX = {

    x:638,

    y:1290,

    width:270,

    height:270

};


/* =====================================================
   NAME POSITION
===================================================== */

const NAME = {

    x:773,

    y:1615,

    maxWidth:240,

    maxSize:48,

    minSize:25

};


/* =====================================================
   VILLAGE POSITION
===================================================== */

const VILLAGE = {

    x:632,

    y:1095,

    width:280,

    height:45,

    maxSize:35,

    minSize:20

};


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
    document.getElementById("posterCanvas");

const ctx =
    canvas.getContext("2d", {
        alpha:false
    });

const photoInput =
    document.getElementById("photoInput");

const nameInput =
    document.getElementById("nameInput");

const villageInput =
    document.getElementById("villageInput");

const videoButton =
    document.getElementById("downloadVideo");

const posterButton =
    document.getElementById("downloadPoster");

const progressBox =
    document.getElementById("progressBox");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const status =
    document.getElementById("status");

const previewVideo =
    document.getElementById("previewVideo");


/* =====================================================
   VARIABLES
===================================================== */

let posterImage = null;

let userPhoto = null;


/* =====================================================
   LOAD POSTER
===================================================== */

function loadPoster(){

    return new Promise((resolve,reject)=>{

        const img = new Image();

        img.onload = function(){

            posterImage = img;

            redraw();

            resolve();

        };

        img.onerror = function(){

            reject(
                new Error(
                    "poster.jpg could not be loaded. Make sure poster.jpg is in the same GitHub Pages folder as index.html."
                )
            );

        };

        /*
           Relative URL.

           Works correctly on GitHub Pages.
        */

        img.src =
            POSTER_FILE + "?v=" + Date.now();

    });

}


/* =====================================================
   LOAD FONT
===================================================== */

async function loadFont(){

    try{

        if(document.fonts){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log(
            "Font warning:",
            error
        );

    }

}


/* =====================================================
   PHOTO UPLOAD
===================================================== */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;


        if(!file.type.startsWith("image/")){

            alert(
                "Please select an image."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                const img =
                    new Image();


                img.onload =
                    function(){

                        userPhoto =
                            img;

                        redraw();

                    };


                img.onerror =
                    function(){

                        alert(
                            "Could not read the selected photo."
                        );

                    };


                img.src =
                    event.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   TEXT INPUT
===================================================== */

nameInput.addEventListener(
    "input",
    redraw
);

villageInput.addEventListener(
    "input",
    redraw
);


/* =====================================================
   DRAW PHOTO
===================================================== */

function drawPhoto(){

    if(!userPhoto)
        return;


    const bx =
        PHOTO_BOX.x;

    const by =
        PHOTO_BOX.y;

    const bw =
        PHOTO_BOX.width;

    const bh =
        PHOTO_BOX.height;


    const imageRatio =
        userPhoto.width /
        userPhoto.height;


    const boxRatio =
        bw / bh;


    let w;
    let h;


    /*
       CONTAIN

       Entire uploaded photo remains visible.
    */

    if(imageRatio > boxRatio){

        w = bw;

        h = w / imageRatio;

    }
    else{

        h = bh;

        w = h * imageRatio;

    }


    const x =
        bx + (bw - w) / 2;

    const y =
        by + (bh - h) / 2;


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        bx,
        by,
        bw,
        bh
    );

    ctx.clip();


    ctx.drawImage(
        userPhoto,
        x,
        y,
        w,
        h
    );


    ctx.restore();

}


/* =====================================================
   DRAW NAME
===================================================== */

function drawName(){

    const name =
        nameInput.value.trim();

    if(!name)
        return;


    let size =
        NAME.maxSize;


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    while(size > NAME.minSize){

        ctx.font =
            `bold ${size}px Arial`;

        if(
            ctx.measureText(name).width
            <=
            NAME.maxWidth
        ){

            break;

        }

        size--;

    }


    ctx.font =
        `bold ${size}px Arial`;


    ctx.fillStyle =
        "#8f2e0f";


    ctx.shadowColor =
        "rgba(0,0,0,.18)";

    ctx.shadowBlur =
        3;


    ctx.fillText(
        name,
        NAME.x,
        NAME.y
    );


    ctx.shadowBlur = 0;

}


/* =====================================================
   DRAW VILLAGE
===================================================== */

function drawVillage(){

    const village =
        villageInput.value.trim();

    if(!village)
        return;


    let size =
        VILLAGE.maxSize;


    const centerX =
        VILLAGE.x +
        VILLAGE.width / 2;


    const centerY =
        VILLAGE.y +
        VILLAGE.height / 2;


    ctx.save();


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    while(size > VILLAGE.minSize){

        ctx.font =
            `${size}px "Mogra", Arial`;

        if(
            ctx.measureText(village).width
            <=
            VILLAGE.width
        ){

            break;

        }

        size--;

    }


    ctx.font =
        `${size}px "Mogra", Arial`;


    ctx.fillStyle =
        "#832404";


    ctx.shadowColor =
        "rgba(0,0,0,.15)";

    ctx.shadowBlur =
        2;


    ctx.fillText(
        village,
        centerX,
        centerY
    );


    ctx.restore();

}


/* =====================================================
   REDRAW POSTER
===================================================== */

function redraw(){

    if(!posterImage)
        return;


    ctx.clearRect(
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       Base poster.
    */

    ctx.drawImage(
        posterImage,
        0,
        0,
        WIDTH,
        HEIGHT
    );


    /*
       User photo.
    */

    drawPhoto();


    /*
       Village.
    */

    drawVillage();


    /*
       User name.
    */

    drawName();

}


/* =====================================================
   DOWNLOAD IMAGE
===================================================== */

posterButton.addEventListener(
    "click",
    async function(){

        redraw();


        canvas.toBlob(
            function(blob){

                if(!blob){

                    alert(
                        "Could not create poster image."
                    );

                    return;

                }


                downloadBlob(
                    blob,
                    "personalised-poster.png"
                );

            },
            "image/png"
        );

    }
);


/* =====================================================
   DOWNLOAD BLOB
===================================================== */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download = filename;


    a.style.display = "none";


    document.body.appendChild(a);

    a.click();

    document.body.removeChild(a);


    setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        15000
    );

}


/* =====================================================
   LOAD AUDIO
===================================================== */

async function loadAudio(){

    status.innerText =
        "Audio loading...";


    const response =
        await fetch(
            AUDIO_FILE + "?v=" + Date.now()
        );


    if(!response.ok){

        throw new Error(
            "audio.mp3 could not be loaded. Make sure audio.mp3 is in the same GitHub Pages folder."
        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContextClass){

        throw new Error(
            "This browser does not support Web Audio."
        );

    }


    const audioContext =
        new AudioContextClass();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    return {
        audioContext,
        audioBuffer
    };

}


/* =====================================================
   FIND BEST VIDEO FORMAT
===================================================== */

function getVideoFormat(){

    if(
        !window.MediaRecorder
    ){

        throw new Error(
            "This browser does not support video recording."
        );

    }


    /*
       Prefer MP4 first.

       Safari/iPhone commonly supports this.
    */

    const formats = [

        {
            mime:
                'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
            extension:
                "mp4"
        },

        {
            mime:
                "video/mp4",
            extension:
                "mp4"
        },

        {
            mime:
                'video/webm;codecs="vp8,opus"',
            extension:
                "webm"
        },

        {
            mime:
                "video/webm;codecs=" +
                "vp9,opus",
            extension:
                "webm"
        },

        {
            mime:
                "video/webm",
            extension:
                "webm"
        }

    ];


    /*
       Find the first format supported
       by the visitor's browser.
    */

    for(
        const format of formats
    ){

        try{

            if(
                MediaRecorder.isTypeSupported(
                    format.mime
                )
            ){

                return format;

            }

        }
        catch(error){

            console.log(
                "Format check:",
                format.mime,
                error
            );

        }

    }


    /*
       Let browser choose if possible.
    */

    try{

        return {
            mime:"",
            extension:"webm"
        };

    }
    catch(error){

        throw new Error(
            "No supported video format was found."
        );

    }

}


/* =====================================================
   RECORD VIDEO
===================================================== */

async function createVideo(){

    if(!posterImage){

        alert(
            "Poster is still loading. Please wait a moment."
        );

        return;

    }


    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    if(!nameInput.value.trim()){

        alert(
            "Please enter your name."
        );

        return;

    }


    if(!villageInput.value.trim()){

        alert(
            "Please enter the village name."
        );

        return;

    }


    /*
       Disable buttons.
    */

    videoButton.disabled = true;

    posterButton.disabled = true;


    progressBox.style.display =
        "block";

    progressFill.style.width =
        "0%";


    previewVideo.style.display =
        "none";


    let audioContext = null;

    let recorder = null;

    let canvasStream = null;

    let combinedStream = null;

    let animationID = null;

    let audioSource = null;


    try{

        await loadFont();


        redraw();


        /*
           Make sure canvas is readable.
        */

        canvas.toDataURL("image/png");


        /*
           Load audio.
        */

        const audio =
            await loadAudio();


        audioContext =
            audio.audioContext;


        const audioBuffer =
            audio.audioBuffer;


        /*
           Resume audio context.

           Important for mobile browsers.
        */

        await audioContext.resume();


        /*
           Canvas video stream.
        */

        canvasStream =
            canvas.captureStream(FPS);


        /*
           Audio stream.
        */

        const audioDestination =
            audioContext
            .createMediaStreamDestination();


        audioSource =
            audioContext
            .createBufferSource();


        audioSource.buffer =
            audioBuffer;


        /*
           If audio is shorter than 30 sec,
           loop it so the video still has
           audio for the full duration.
        */

        if(
            audioBuffer.duration <
            VIDEO_DURATION
        ){

            audioSource.loop = true;

        }


        audioSource.connect(
            audioDestination
        );


        /*
           Combined stream.
        */

        combinedStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                function(track){

                    combinedStream.addTrack(
                        track
                    );

                }
            );


        audioDestination
            .stream
            .getAudioTracks()
            .forEach(
                function(track){

                    combinedStream.addTrack(
                        track
                    );

                }
            );


        /*
           Browser-specific format.
        */

        const format =
            getVideoFormat();


        status.innerText =
            "Video format: " +
            (
                format.extension === "mp4"
                ? "MP4"
                : "WebM"
            );


        /*
           MediaRecorder options.
        */

        const options = {

            videoBitsPerSecond:
                2500000,

            audioBitsPerSecond:
                128000

        };


        if(format.mime){

            options.mimeType =
                format.mime;

        }


        /*
           Create recorder.
        */

        recorder =
            new MediaRecorder(
                combinedStream,
                options
            );


        const chunks = [];


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        const stopped =
            new Promise(
                function(resolve,reject){

                    recorder.onstop =
                        function(){

                            resolve();

                        };


                    recorder.onerror =
                        function(event){

                            reject(
                                event.error ||
                                new Error(
                                    "Video recording failed."
                                )
                            );

                        };

                }
            );


        /*
           IMPORTANT:

           Continuously redraw the poster.

           This ensures that the canvas video
           contains real video frames.

           This fixes the problem where Chrome
           downloaded audio but the poster/video
           appeared blank.
        */

        let startTime =
            performance.now();


        function animate(){

            redraw();


            const elapsed =
                (
                    performance.now() -
                    startTime
                ) / 1000;


            const percent =
                Math.min(
                    100,
                    elapsed /
                    VIDEO_DURATION *
                    100
                );


            progressFill.style.width =
                percent + "%";


            progressText.innerText =
                "Video બનાવાઈ રહ્યું છે... " +
                Math.floor(percent) +
                "%";


            if(
                elapsed <
                VIDEO_DURATION
            ){

                animationID =
                    requestAnimationFrame(
                        animate
                    );

            }

        }


        /*
           Start recording BEFORE audio.
        */

        recorder.start(1000);


        /*
           Start canvas animation.
        */

        startTime =
            performance.now();


        animate();


        /*
           Start audio.
        */

        audioSource.start(0);


        /*
           Wait 30 seconds.
        */

        await new Promise(
            function(resolve){

                setTimeout(
                    resolve,
                    VIDEO_DURATION * 1000
                );

            }
        );


        /*
           Stop animation.
        */

        if(animationID){

            cancelAnimationFrame(
                animationID
            );

        }


        /*
           Stop audio.
        */

        try{

            audioSource.stop();

        }
        catch(error){}


        /*
           Stop recorder.
        */

        if(
            recorder.state !==
            "inactive"
        ){

            recorder.stop();

        }


        await stopped;


        /*
           Final poster frame.
        */

        redraw();


        /*
           Create video Blob.
        */

        const finalType =
            recorder.mimeType ||
            format.mime ||
            "video/webm";


        const videoBlob =
            new Blob(
                chunks,
                {
                    type:finalType
                }
            );


        if(
            !videoBlob ||
            videoBlob.size <
            1000
        ){

            throw new Error(
                "The browser created an empty video."
            );

        }


        /*
           Determine extension from
           the actual recorded MIME type.
        */

        let extension;


        if(
            finalType
            .toLowerCase()
            .includes("mp4")
        ){

            extension =
                "mp4";

        }
        else{

            extension =
                "webm";

        }


        /*
           Preview the generated video
           before downloading.

           This is important for mobile.
        */

        const previewURL =
            URL.createObjectURL(
                videoBlob
            );


        previewVideo.src =
            previewURL;


        previewVideo.style.display =
            "block";


        /*
           Download.
        */

        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Video તૈયાર છે. Download શરૂ થઈ રહ્યું છે...";


        downloadBlob(
            videoBlob,
            "personalised-poster-video." +
            extension
        );


        status.innerText =
            "✅ Video downloaded as ." +
            extension;


    }
    catch(error){

        console.error(
            "VIDEO ERROR:",
            error
        );


        alert(
            "Video બનાવવામાં error:\n\n" +
            error.message
        );


        status.innerText =
            "Video could not be created.";

    }
    finally{

        /*
           Cleanup.
        */

        if(animationID){

            cancelAnimationFrame(
                animationID
            );

        }


        if(audioSource){

            try{

                audioSource.disconnect();

            }
            catch(error){}

        }


        if(combinedStream){

            combinedStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        if(audioContext){

            try{

                await audioContext.close();

            }
            catch(error){}

        }


        videoButton.disabled =
            false;

        posterButton.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            3000
        );

    }

}


/* =====================================================
   BUTTON
===================================================== */

videoButton.addEventListener(
    "click",
    createVideo
);


/* =====================================================
   START
===================================================== */

(async function(){

    try{

        await loadFont();

        await loadPoster();

        status.innerText =
            "✅ Poster ready.";

    }
    catch(error){

        console.error(
            error
        );


        alert(
            error.message
        );

    }

})();

</script>

</body>
</html>
