<!-- =====================================================

===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd/ffmpeg.js"></script>



<script>

/* =========================================================
   BASIC SETTINGS
========================================================= */

const POSTER_WIDTH = 928;

const POSTER_HEIGHT = 1640;

const VIDEO_SECONDS = 30;

const POSTER_FILE = "poster.jpg";

const AUDIO_FILE = "audio.mp3";


/* =========================================================
   PHOTO FRAME
========================================================= */

const PHOTO_BOX = {

    x:638,

    y:1290,

    width:270,

    height:270

};


/* =========================================================
   NAME POSITION
========================================================= */

const NAME_POSITION = {

    x:773,

    y:1615,

    maxWidth:240,

    fontSize:48,

    minFontSize:25

};


/* =========================================================
   VILLAGE POSITION
========================================================= */

const VILLAGE_POSITION = {

    x:632,

    y:1095,

    width:280,

    height:45,

    fontSize:35,

    color:"#832404",

    fontFamily:"Mogra"

};


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById(
        "posterCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const photoInput =
    document.getElementById(
        "photoInput"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const villageInput =
    document.getElementById(
        "villageInput"
    );


const downloadVideo =
    document.getElementById(
        "downloadVideo"
    );


const downloadPoster =
    document.getElementById(
        "downloadPoster"
    );


const progressBox =
    document.getElementById(
        "progressBox"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const ffmpegStatus =
    document.getElementById(
        "ffmpegStatus"
    );


/* =========================================================
   VARIABLES
========================================================= */

let posterImage = null;

let userPhoto = null;

let ffmpeg = null;

let ffmpegLoaded = false;


/* =========================================================
   WAIT FOR MOGRA FONT
========================================================= */

async function loadMograFont(){

    try{

        if(
            document.fonts &&
            document.fonts.load
        ){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log(
            "Mogra font loading warning:",
            error
        );

    }

}


/* =========================================================
   LOAD POSTER
========================================================= */

async function loadPoster(){

    try{

        const response =
            await fetch(
                POSTER_FILE,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "poster.jpg not found. Put poster.jpg beside index.html."
            );

        }


        const posterBlob =
            await response.blob();


        /*
           IMPORTANT:

           Convert poster.jpg into a local Blob URL.

           This prevents the canvas from becoming
           cross-origin tainted.
        */

        const posterURL =
            URL.createObjectURL(
                posterBlob
            );


        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();


                img.onload =
                    function(){

                        posterImage =
                            img;


                        URL.revokeObjectURL(
                            posterURL
                        );


                        redraw();

                        resolve();

                    };


                img.onerror =
                    function(){

                        URL.revokeObjectURL(
                            posterURL
                        );


                        reject(
                            new Error(
                                "Could not load poster.jpg."
                            )
                        );

                    };


                img.src =
                    posterURL;

            }
        );


    }
    catch(error){

        console.error(
            "POSTER ERROR:",
            error
        );


        if(
            window.location.protocol ===
            "file:"
        ){

            throw new Error(

                "Please open your GitHub Pages URL.\n\n" +

                "Do not open index.html using file://.\n\n" +

                "Upload index.html, poster.jpg and audio.mp3 to GitHub Pages."

            );

        }


        throw error;

    }

}


/* =========================================================
   PHOTO UPLOAD
========================================================= */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const img =
                    new Image();


                img.onload =
                    function(){

                        userPhoto =
                            img;


                        redraw();

                    };


                img.src =
                    e.target.result;

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================================
   TEXT INPUT
========================================================= */

nameInput.addEventListener(
    "input",
    redraw
);


villageInput.addEventListener(
    "input",
    redraw
);


/* =========================================================
   DRAW PHOTO
========================================================= */

function drawPhotoContain(){

    if(!userPhoto)
        return;


    const boxX =
        PHOTO_BOX.x;


    const boxY =
        PHOTO_BOX.y;


    const boxW =
        PHOTO_BOX.width;


    const boxH =
        PHOTO_BOX.height;


    const imageRatio =
        userPhoto.width /
        userPhoto.height;


    const boxRatio =
        boxW /
        boxH;


    let drawW;

    let drawH;


    if(
        imageRatio >
        boxRatio
    ){

        drawW =
            boxW;


        drawH =
            drawW /
            imageRatio;

    }
    else{

        drawH =
            boxH;


        drawW =
            drawH *
            imageRatio;

    }


    const drawX =
        boxX +
        (boxW - drawW) / 2;


    const drawY =
        boxY +
        (boxH - drawH) / 2;


    ctx.save();


    ctx.beginPath();


    ctx.rect(
        boxX,
        boxY,
        boxW,
        boxH
    );


    ctx.clip();


    ctx.drawImage(

        userPhoto,

        drawX,

        drawY,

        drawW,

        drawH

    );


    ctx.restore();

}


/* =========================================================
   DRAW NAME
========================================================= */

function drawName(){

    const name =
        nameInput.value.trim();


    if(!name)
        return;


    let fontSize =
        NAME_POSITION.fontSize;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        `bold ${fontSize}px Arial`;


    /*
       Automatically reduce font
       if name is too long.
    */

    while(

        ctx.measureText(
            name
        ).width >
        NAME_POSITION.maxWidth

        &&

        fontSize >
        NAME_POSITION.minFontSize

    ){

        fontSize--;


        ctx.font =
            `bold ${fontSize}px Arial`;

    }


    ctx.shadowColor =
        "rgba(0,0,0,.18)";


    ctx.shadowBlur =
        3;


    ctx.fillStyle =
        "#8f2e0f";


    ctx.fillText(

        name,

        NAME_POSITION.x,

        NAME_POSITION.y

    );


    ctx.shadowBlur =
        0;

}


/* =========================================================
   DRAW VILLAGE
========================================================= */

function drawVillage(){

    const village =
        villageInput.value.trim();


    if(!village)
        return;


    ctx.save();


    /*
       Mogra font
    */

    ctx.font =
        `35px "Mogra", Arial, sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        VILLAGE_POSITION.color;


    ctx.shadowColor =
        "rgba(0,0,0,.15)";


    ctx.shadowBlur =
        2;


    const villageCenterX =
        VILLAGE_POSITION.x +
        (
            VILLAGE_POSITION.width /
            2
        );


    const villageCenterY =
        VILLAGE_POSITION.y +
        (
            VILLAGE_POSITION.height /
            2
        );


    ctx.fillText(

        village,

        villageCenterX,

        villageCenterY

    );


    ctx.restore();

}


/* =========================================================
   REDRAW
========================================================= */

function redraw(){

    if(!posterImage)
        return;


    ctx.clearRect(

        0,

        0,

        POSTER_WIDTH,

        POSTER_HEIGHT

    );


    ctx.drawImage(

        posterImage,

        0,

        0,

        POSTER_WIDTH,

        POSTER_HEIGHT

    );


    drawPhotoContain();


    drawVillage();


    drawName();

}


/* =========================================================
   DOWNLOAD POSTER IMAGE
========================================================= */

downloadPoster.addEventListener(
    "click",
    function(){

        redraw();


        canvas.toBlob(

            function(blob){

                if(!blob){

                    alert(
                        "Could not create poster image."
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement(
                        "a"
                    );


                a.href =
                    url;


                a.download =
                    "personalised-poster.png";


                document.body.appendChild(
                    a
                );


                a.click();


                a.remove();


                setTimeout(
                    function(){

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            },

            "image/png"

        );

    }
);


/* =========================================================
   LOAD AUDIO
========================================================= */

async function loadAudio(){

    const response =
        await fetch(
            AUDIO_FILE,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(

            "audio.mp3 not found. " +

            "Put audio.mp3 beside index.html."

        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContextClass){

        throw new Error(
            "Your browser does not support Web Audio."
        );

    }


    const audioContext =
        new AudioContextClass();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    return {

        audioContext,

        audioBuffer

    };

}


/* =========================================================
   CONVERT URL TO BLOB URL
=========================================================

   This replaces @ffmpeg/util's toBlobURL().

   Therefore the problematic @ffmpeg/util library
   is completely removed.
========================================================= */

async function makeBlobURL(
    url,
    mimeType
){

    const response =
        await fetch(
            url,
            {
                cache:"force-cache"
            }
        );


    if(!response.ok){

        throw new Error(

            "Could not load FFmpeg file:\n" +
            url

        );

    }


    const blob =
        await response.blob();


    const typedBlob =
        new Blob(
            [blob],
            {
                type:mimeType
            }
        );


    return URL.createObjectURL(
        typedBlob
    );

}


/* =========================================================
   LOAD FFMPEG
========================================================= */

async function loadFFmpeg(){

    if(ffmpegLoaded)
        return;


    /*
       Check FFmpeg main library.
    */

    if(
        typeof FFmpegWASM ===
        "undefined"
    ){

        throw new Error(

            "FFmpeg library did not load.\n\n" +

            "Please check your internet connection."

        );

    }


    progressText.innerText =
        "MP4 converter loading...";


    ffmpegStatus.innerText =
        "FFmpeg converter is loading for the first time...";


    const {
        FFmpeg
    } =
        FFmpegWASM;


    ffmpeg =
        new FFmpeg();


    /*
       FFmpeg logs.
    */

    ffmpeg.on(
        "log",
        function({
            message
        }){

            console.log(
                "FFmpeg:",
                message
            );

        }
    );


    /*
       FFmpeg progress.
    */

    ffmpeg.on(
        "progress",
        function({
            progress
        }){

            if(

                progress >= 0 &&

                progress <= 1

            ){

                const percent =
                    Math.round(
                        progress * 100
                    );


                progressFill.style.width =
                    percent + "%";

            }

        }
    );


    /*
       FFmpeg core location.
    */

    const baseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


    progressText.innerText =
        "FFmpeg core loading...";


    /*
       Create local Blob URLs.

       This avoids the @ffmpeg/util problem
       AND avoids cross-origin worker problems.
    */

    const coreURL =
        await makeBlobURL(

            `${baseURL}/ffmpeg-core.js`,

            "text/javascript"

        );


    const wasmURL =
        await makeBlobURL(

            `${baseURL}/ffmpeg-core.wasm`,

            "application/wasm"

        );


    const workerURL =
        await makeBlobURL(

            `${baseURL}/ffmpeg-core.worker.js`,

            "text/javascript"

        );


    try{

        await ffmpeg.load({

            coreURL:
                coreURL,

            wasmURL:
                wasmURL,

            workerURL:
                workerURL

        });

    }
    finally{

        /*
           Blob URLs are kept while FFmpeg
           is running. Do not revoke them here.
        */

    }


    ffmpegLoaded =
        true;


    progressText.innerText =
        "FFmpeg converter ready.";


    ffmpegStatus.innerText =
        "MP4 converter ready.";

}


/* =========================================================
   CHOOSE VIDEO FORMAT
========================================================= */

function getSupportedMimeType(){

    const types = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm",

        "video/mp4"

    ];


    for(
        const type of types
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return type;

        }

    }


    throw new Error(

        "Your browser does not support video recording."

    );

}


/* =========================================================
   RECORD WEBM
========================================================= */

async function recordWebM(){

    const {
        audioContext,
        audioBuffer
    } =
        await loadAudio();


    /*
       Canvas video.
    */

    const canvasStream =
        canvas.captureStream(
            15
        );


    /*
       Audio recording stream.
    */

    const audioDestination =
        audioContext
        .createMediaStreamDestination();


    const audioSource =
        audioContext
        .createBufferSource();


    audioSource.buffer =
        audioBuffer;


    audioSource.connect(
        audioDestination
    );


    /*
       Combined stream.
    */

    const combinedStream =
        new MediaStream();


    canvasStream
        .getVideoTracks()
        .forEach(
            function(track){

                combinedStream.addTrack(
                    track
                );

            }
        );


    audioDestination
        .stream
        .getAudioTracks()
        .forEach(
            function(track){

                combinedStream.addTrack(
                    track
                );

            }
        );


    /*
       Find supported browser format.
    */

    const mimeType =
        getSupportedMimeType();


    const recorder =
        new MediaRecorder(

            combinedStream,

            {

                mimeType:
                    mimeType,

                videoBitsPerSecond:
                    1800000,

                audioBitsPerSecond:
                    128000

            }

        );


    const chunks = [];


    recorder.ondataavailable =
        function(event){

            if(

                event.data &&

                event.data.size > 0

            ){

                chunks.push(
                    event.data
                );

            }

        };


    const finished =
        new Promise(
            function(resolve){

                recorder.onstop =
                    resolve;

            }
        );


    /*
       Start recording.
    */

    recorder.start(
        1000
    );


    await audioContext.resume();


    audioSource.start(
        0
    );


    const startTime =
        performance.now();


    /*
       30 SECOND TIMER.
    */

    await new Promise(
        function(resolve){

            function update(){

                const elapsed =
                    (
                        performance.now()
                        -
                        startTime
                    ) / 1000;


                const percent =
                    Math.min(

                        100,

                        (
                            elapsed /
                            VIDEO_SECONDS
                        ) * 100

                    );


                progressFill.style.width =
                    percent + "%";


                progressText.innerText =

                    `Poster video બનાવાઈ રહ્યું છે... ${Math.floor(percent)}%`;


                if(
                    elapsed >=
                    VIDEO_SECONDS
                ){

                    resolve();

                }
                else{

                    requestAnimationFrame(
                        update
                    );

                }

            }


            update();

        }
    );


    /*
       Stop audio.
    */

    try{

        audioSource.stop();

    }
    catch(error){

        console.log(
            "Audio already stopped."
        );

    }


    /*
       Stop recorder.
    */

    recorder.stop();


    await finished;


    /*
       Stop streams.
    */

    combinedStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    canvasStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    try{

        await audioContext.close();

    }
    catch(error){

        console.log(
            "AudioContext close warning:",
            error
        );

    }


    return new Blob(

        chunks,

        {
            type:mimeType
        }

    );

}


/* =========================================================
   WEBM → REAL MP4
========================================================= */

async function convertToMP4(
    webmBlob
){

    await loadFFmpeg();


    progressText.innerText =
        "Real MP4 conversion શરૂ થઈ રહ્યું છે...";


    progressFill.style.width =
        "0%";


    /*
       Convert Blob to Uint8Array.
    */

    const inputData =
        new Uint8Array(

            await webmBlob.arrayBuffer()

        );


    /*
       Write input file.
    */

    await ffmpeg.writeFile(

        "input.webm",

        inputData

    );


    /*
       Convert WebM → H.264 MP4.

       AAC audio.

       Fast start for phones.
    */

    const exitCode =
        await ffmpeg.exec([

            "-i",

            "input.webm",


            "-c:v",

            "libx264",


            "-preset",

            "ultrafast",


            "-crf",

            "28",


            "-pix_fmt",

            "yuv420p",


            "-c:a",

            "aac",


            "-b:a",

            "128k",


            "-movflags",

            "+faststart",


            "output.mp4"

        ]);


    if(
        exitCode !== 0
    ){

        throw new Error(

            "FFmpeg could not create the MP4."

        );

    }


    /*
       Read final MP4.
    */

    const outputData =
        await ffmpeg.readFile(
            "output.mp4"
        );


    /*
       Clean temporary files.
    */

    try{

        await ffmpeg.deleteFile(
            "input.webm"
        );

    }
    catch(error){}


    try{

        await ffmpeg.deleteFile(
            "output.mp4"
        );

    }
    catch(error){}


    /*
       Return actual MP4 Blob.
    */

    return new Blob(

        [outputData],

        {
            type:"video/mp4"
        }

    );

}


/* =========================================================
   DOWNLOAD BLOB
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        filename;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        10000
    );

}


/* =========================================================
   CREATE VIDEO
========================================================= */

async function createVideo(){

    /*
       Photo check.
    */

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    /*
       Name check.
    */

    if(
        !nameInput.value.trim()
    ){

        alert(
            "Please enter your name."
        );

        return;

    }


    /*
       Village check.
    */

    if(
        !villageInput.value.trim()
    ){

        alert(
            "Please enter the village name."
        );

        return;

    }


    /*
       Disable buttons.
    */

    downloadVideo.disabled =
        true;


    downloadPoster.disabled =
        true;


    progressBox.style.display =
        "block";


    progressFill.style.width =
        "0%";


    try{

        /*
           Make sure Mogra is loaded.
        */

        await loadMograFont();


        /*
           Draw final poster.
        */

        redraw();


        /*
           Test canvas.

           If this fails, poster image is
           cross-origin/tainted.
        */

        try{

            canvas.toDataURL(
                "image/png"
            );

        }
        catch(canvasError){

            throw new Error(

                "Canvas security error.\n\n" +

                "Please open the GitHub Pages HTTPS URL, " +

                "not the file:// index.html."

            );

        }


        /*
           STEP 1:
           Poster + audio → WebM.
        */

        const webmBlob =
            await recordWebM();


        if(

            !webmBlob ||

            webmBlob.size === 0

        ){

            throw new Error(

                "Temporary video could not be created."

            );

        }


        /*
           STEP 2:
           WebM → MP4.
        */

        const mp4Blob =
            await convertToMP4(
                webmBlob
            );


        if(

            !mp4Blob ||

            mp4Blob.size === 0

        ){

            throw new Error(

                "Final MP4 file is empty."

            );

        }


        /*
           STEP 3:
           Download MP4.
        */

        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Real MP4 તૈયાર છે — Download શરૂ થઈ રહ્યું છે...";


        downloadBlob(

            mp4Blob,

            "personalised-poster-video.mp4"

        );


        ffmpegStatus.innerText =
            "✅ MP4 successfully created.";


    }
    catch(error){

        console.error(
            "MP4 ERROR:",
            error
        );


        alert(

            "MP4 download error:\n\n" +

            error.message +

            "\n\n" +

            "Please check that poster.jpg and audio.mp3 " +

            "are in the same GitHub Pages folder."

        );

    }
    finally{

        downloadVideo.disabled =
            false;


        downloadPoster.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            5000
        );

    }

}


/* =========================================================
   VIDEO BUTTON
========================================================= */

downloadVideo.addEventListener(
    "click",
    createVideo
);

        );
