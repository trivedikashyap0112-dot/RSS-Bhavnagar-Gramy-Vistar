<!DOCTYPE html>
<html lang="gu">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Personalised Poster</title>

<link rel="preconnect"
      href="https://fonts.googleapis.com">

<link rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Mogra&display=swap"
      rel="stylesheet">


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#222;
}

.container{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:18px;
}

h1{
    text-align:center;
    margin:5px 0 18px;
    font-size:24px;
}

.control-box{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input[type="text"],
input[type="file"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:14px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#downloadVideo{
    background:#e85d04;
    color:white;
}

#downloadPoster{
    background:#333;
    color:white;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.poster-wrapper{
    width:100%;
    background:white;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

#posterCanvas{
    width:100%;
    height:auto;
    display:block;
}

.progress{
    display:none;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#e85d04;
    transition:width:.1s linear;
}

.status{
    font-size:13px;
    color:#666;
    text-align:center;
    margin-top:8px;
    line-height:1.5;
}

.note{
    font-size:13px;
    color:#666;
    text-align:center;
    margin-top:10px;
    line-height:1.5;
}

</style>

</head>


<body>


<div class="container">


<h1>
તમારું Personalised Poster બનાવો
</h1>


<div class="control-box">


<label>
તમારો ફોટો Upload કરો
</label>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>


<label>
તમારું નામ
</label>

<input
    type="text"
    id="nameInput"
    placeholder="તમારું નામ લખો"
>


<label>
પ્રવાસમાં જવાનું ગામ
</label>

<input
    type="text"
    id="villageInput"
    placeholder="ગામનું નામ લખો"
>


<button id="downloadVideo">

🎬 Download Poster Video

</button>


<button id="downloadPoster">

🖼️ Download Poster Image

</button>


<div
    class="progress"
    id="progressBox"
>

<div id="progressText">
Video તૈયાર થઈ રહ્યું છે...
</div>


<div class="progress-bar">

<div
    class="progress-fill"
    id="progressFill">
</div>

</div>

</div>


<div
    class="status"
    id="statusText">
</div>


<div class="note">

Video માં poster + audio ના પ્રથમ 30 seconds રહેશે.

</div>


</div>


<div class="poster-wrapper">

<canvas
    id="posterCanvas"
    width="928"
    height="1640">
</canvas>

</div>


</div>


<script>


/* =========================================================
   SETTINGS
========================================================= */

const POSTER_WIDTH = 928;

const POSTER_HEIGHT = 1640;

const VIDEO_SECONDS = 30;

const POSTER_FILE = "poster.jpg";

const AUDIO_FILE = "audio.mp3";


/* =========================================================
   PHOTO POSITION
========================================================= */

const PHOTO_BOX = {

    x:638,

    y:1290,

    width:270,

    height:270

};


/* =========================================================
   NAME POSITION
========================================================= */

const NAME_POSITION = {

    x:773,

    y:1615,

    maxWidth:240,

    fontSize:48,

    minFontSize:25

};


/* =========================================================
   VILLAGE POSITION
========================================================= */

const VILLAGE_POSITION = {

    x:632,

    y:1095,

    width:280,

    height:45,

    fontSize:35,

    color:"#832404"

};


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("posterCanvas");

const ctx =
    canvas.getContext("2d");

const photoInput =
    document.getElementById("photoInput");

const nameInput =
    document.getElementById("nameInput");

const villageInput =
    document.getElementById("villageInput");

const downloadVideo =
    document.getElementById("downloadVideo");

const downloadPoster =
    document.getElementById("downloadPoster");

const progressBox =
    document.getElementById("progressBox");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const statusText =
    document.getElementById("statusText");


/* =========================================================
   VARIABLES
========================================================= */

let posterImage = null;

let userPhoto = null;


/* =========================================================
   LOAD POSTER
========================================================= */

async function loadPoster(){

    const response =
        await fetch(
            POSTER_FILE + "?v=" + Date.now()
        );


    if(!response.ok){

        throw new Error(
            "poster.jpg not found.\n\n" +
            "Put poster.jpg in the same folder as index.html."
        );

    }


    const blob =
        await response.blob();


    const url =
        URL.createObjectURL(blob);


    await new Promise(
        (resolve,reject)=>{

            const img =
                new Image();


            img.onload =
                function(){

                    posterImage =
                        img;

                    URL.revokeObjectURL(url);

                    redraw();

                    resolve();

                };


            img.onerror =
                function(){

                    URL.revokeObjectURL(url);

                    reject(
                        new Error(
                            "poster.jpg could not be loaded."
                        )
                    );

                };


            img.src = url;

        }
    );

}


/* =========================================================
   LOAD MOGRA
========================================================= */

async function loadFont(){

    try{

        if(document.fonts){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log(
            "Font warning:",
            error
        );

    }

}


/* =========================================================
   PHOTO UPLOAD
========================================================= */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file)
            return;


        if(!file.type.startsWith("image/")){

            alert(
                "Please select an image."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                const img =
                    new Image();


                img.onload =
                    function(){

                        userPhoto =
                            img;

                        redraw();

                    };


                img.src =
                    event.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================================
   INPUT EVENTS
========================================================= */

nameInput.addEventListener(
    "input",
    redraw
);

villageInput.addEventListener(
    "input",
    redraw
);


/* =========================================================
   DRAW PHOTO
========================================================= */

function drawPhoto(){

    if(!userPhoto)
        return;


    const boxX =
        PHOTO_BOX.x;

    const boxY =
        PHOTO_BOX.y;

    const boxW =
        PHOTO_BOX.width;

    const boxH =
        PHOTO_BOX.height;


    const imageRatio =
        userPhoto.width /
        userPhoto.height;


    const boxRatio =
        boxW /
        boxH;


    let drawW;

    let drawH;


    if(imageRatio > boxRatio){

        drawW =
            boxW;

        drawH =
            drawW /
            imageRatio;

    }
    else{

        drawH =
            boxH;

        drawW =
            drawH *
            imageRatio;

    }


    const drawX =
        boxX +
        (boxW - drawW) / 2;


    const drawY =
        boxY +
        (boxH - drawH) / 2;


    ctx.save();


    ctx.beginPath();

    ctx.rect(
        boxX,
        boxY,
        boxW,
        boxH
    );

    ctx.clip();


    ctx.drawImage(
        userPhoto,
        drawX,
        drawY,
        drawW,
        drawH
    );


    ctx.restore();

}


/* =========================================================
   DRAW NAME
========================================================= */

function drawName(){

    const name =
        nameInput.value.trim();


    if(!name)
        return;


    let size =
        NAME_POSITION.fontSize;


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.font =
        `bold ${size}px Arial`;


    while(

        ctx.measureText(name).width >
        NAME_POSITION.maxWidth

        &&

        size >
        NAME_POSITION.minFontSize

    ){

        size--;

        ctx.font =
            `bold ${size}px Arial`;

    }


    ctx.fillStyle =
        "#8f2e0f";


    ctx.shadowColor =
        "rgba(0,0,0,.18)";


    ctx.shadowBlur =
        3;


    ctx.fillText(

        name,

        NAME_POSITION.x,

        NAME_POSITION.y

    );


    ctx.shadowBlur =
        0;

}


/* =========================================================
   DRAW VILLAGE
========================================================= */

function drawVillage(){

    const village =
        villageInput.value.trim();


    if(!village)
        return;


    ctx.save();


    ctx.font =
        `35px "Mogra", Arial, sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        VILLAGE_POSITION.color;


    ctx.shadowColor =
        "rgba(0,0,0,.15)";


    ctx.shadowBlur =
        2;


    const centerX =
        VILLAGE_POSITION.x +
        VILLAGE_POSITION.width / 2;


    const centerY =
        VILLAGE_POSITION.y +
        VILLAGE_POSITION.height / 2;


    /*
       Prevent very long village names
       from escaping the area.
    */

    let size =
        VILLAGE_POSITION.fontSize;


    while(

        ctx.measureText(village).width >
        VILLAGE_POSITION.width

        &&

        size > 20

    ){

        size--;

        ctx.font =
            `${size}px "Mogra", Arial, sans-serif`;

    }


    ctx.fillText(

        village,

        centerX,

        centerY

    );


    ctx.restore();

}


/* =========================================================
   REDRAW POSTER
========================================================= */

function redraw(){

    if(!posterImage)
        return;


    ctx.clearRect(
        0,
        0,
        POSTER_WIDTH,
        POSTER_HEIGHT
    );


    ctx.drawImage(

        posterImage,

        0,
        0,

        POSTER_WIDTH,
        POSTER_HEIGHT

    );


    drawPhoto();

    drawVillage();

    drawName();

}


/* =========================================================
   DOWNLOAD IMAGE
========================================================= */

downloadPoster.addEventListener(
    "click",
    function(){

        redraw();


        canvas.toBlob(
            function(blob){

                if(!blob){

                    alert(
                        "Poster image could not be created."
                    );

                    return;

                }


                downloadBlob(
                    blob,
                    "personalised-poster.png"
                );

            },
            "image/png"
        );

    }
);


/* =========================================================
   CHECK VIDEO FORMAT
========================================================= */

function getVideoFormat(){

    /*
       Safari / browsers supporting MP4 recording.

       H.264 + AAC is the preferred combination
       for mobile compatibility.
    */

    const mp4Types = [

        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

        'video/mp4;codecs="avc1.4D401E,mp4a.40.2"',

        "video/mp4"

    ];


    for(
        const type of mp4Types
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return {

                mimeType:type,

                extension:"mp4"

            };

        }

    }


    /*
       Chrome normally falls back
       to WebM when MP4 recording
       isn't available.
    */

    const webmTypes = [

        'video/webm;codecs="vp8,opus"',

        'video/webm;codecs="vp9,opus"',

        "video/webm"

    ];


    for(
        const type of webmTypes
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return {

                mimeType:type,

                extension:"webm"

            };

        }

    }


    return null;

}


/* =========================================================
   LOAD AUDIO
========================================================= */

async function loadAudio(){

    const response =
        await fetch(
            AUDIO_FILE + "?v=" + Date.now()
        );


    if(!response.ok){

        throw new Error(

            "audio.mp3 not found.\n\n" +

            "Put audio.mp3 in the same folder as index.html."

        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContextClass){

        throw new Error(
            "This browser does not support Web Audio."
        );

    }


    const audioContext =
        new AudioContextClass();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    return {

        audioContext,
        audioBuffer

    };

}


/* =========================================================
   CREATE AUDIO STREAM
========================================================= */

async function createAudioStream(){

    const {

        audioContext,

        audioBuffer

    } =
        await loadAudio();


    const destination =
        audioContext
        .createMediaStreamDestination();


    const source =
        audioContext
        .createBufferSource();


    source.buffer =
        audioBuffer;


    /*
       Loop if the supplied audio is
       shorter than 30 seconds.
    */

    if(
        audioBuffer.duration <
        VIDEO_SECONDS
    ){

        source.loop =
            true;

    }


    source.connect(
        destination
    );


    await audioContext.resume();


    return {

        audioContext,

        destination,

        source

    };

}


/* =========================================================
   RECORD VIDEO
========================================================= */

async function createVideo(){

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    if(!nameInput.value.trim()){

        alert(
            "Please enter your name."
        );

        return;

    }


    if(!villageInput.value.trim()){

        alert(
            "Please enter the village name."
        );

        return;

    }


    if(
        typeof MediaRecorder ===
        "undefined"
    ){

        alert(
            "This browser does not support video recording."
        );

        return;

    }


    const format =
        getVideoFormat();


    if(!format){

        alert(

            "This browser cannot create a downloadable video.\n\n" +

            "Please use an updated Safari or Chrome."

        );

        return;

    }


    downloadVideo.disabled =
        true;

    downloadPoster.disabled =
        true;


    progressBox.style.display =
        "block";


    progressFill.style.width =
        "0%";


    statusText.innerText =
        `Video format: ${format.extension.toUpperCase()}`;


    let audioData = null;

    let recorder = null;

    let canvasStream = null;


    try{

        await loadFont();

        redraw();


        /*
           Create canvas video stream.

           20 FPS gives a smooth enough
           static-poster video while keeping
           the file size reasonable.
        */

        canvasStream =
            canvas.captureStream(20);


        /*
           Create audio stream.
        */

        audioData =
            await createAudioStream();


        /*
           Add audio track to video stream.
        */

        const finalStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                function(track){

                    finalStream.addTrack(
                        track
                    );

                }
            );


        audioData.destination
            .stream
            .getAudioTracks()
            .forEach(
                function(track){

                    finalStream.addTrack(
                        track
                    );

                }
            );


        /*
           Create recorder.
        */

        recorder =
            new MediaRecorder(

                finalStream,

                {

                    mimeType:
                        format.mimeType,

                    videoBitsPerSecond:
                        1600000,

                    audioBitsPerSecond:
                        128000

                }

            );


        const chunks = [];


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        const stopped =
            new Promise(
                function(resolve,reject){

                    recorder.onstop =
                        resolve;


                    recorder.onerror =
                        function(event){

                            reject(
                                event.error ||
                                new Error(
                                    "Video recording failed."
                                )
                            );

                        };

                }
            );


        /*
           START AUDIO
        */

        audioData.source.start(0);


        /*
           START VIDEO RECORDING
        */

        recorder.start(1000);


        const start =
            performance.now();


        /*
           Wait exactly 30 seconds.
        */

        await new Promise(
            function(resolve){

                function update(){

                    const elapsed =
                        (
                            performance.now()
                            -
                            start
                        ) / 1000;


                    const percent =
                        Math.min(

                            100,

                            (
                                elapsed /
                                VIDEO_SECONDS
                            ) * 100

                        );


                    progressFill.style.width =
                        percent + "%";


                    progressText.innerText =

                        `Poster video બનાવાઈ રહ્યું છે... ${Math.floor(percent)}%`;


                    if(
                        elapsed >=
                        VIDEO_SECONDS
                    ){

                        resolve();

                    }
                    else{

                        requestAnimationFrame(
                            update
                        );

                    }

                }


                update();

            }
        );


        /*
           STOP AUDIO
        */

        try{

            audioData.source.stop();

        }
        catch(e){}


        /*
           STOP RECORDING
        */

        recorder.stop();


        await stopped;


        /*
           Create final blob.
        */

        const blob =
            new Blob(

                chunks,

                {
                    type:
                        format.mimeType
                }

            );


        if(
            blob.size <
            10000
        ){

            throw new Error(
                "The generated video file is too small."
            );

        }


        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Video તૈયાર છે — Download શરૂ થઈ રહ્યું છે...";


        /*
           IMPORTANT:

           Use the correct extension.

           MP4 → .mp4
           WebM → .webm

           NEVER rename WebM to MP4.
        */

        downloadBlob(

            blob,

            `personalised-poster-video.${format.extension}`

        );


        statusText.innerText =

            `✅ Downloaded as ${format.extension.toUpperCase()} with poster + audio.`;


    }
    catch(error){

        console.error(
            "VIDEO ERROR:",
            error
        );


        alert(

            "Video બનાવવામાં error આવ્યો:\n\n" +

            error.message

        );

    }
    finally{

        /*
           Stop all tracks.
        */

        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        if(audioData){

            try{

                await audioData.audioContext.close();

            }
            catch(e){}

        }


        downloadVideo.disabled =
            false;

        downloadPoster.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            4000
        );

    }

}


/* =========================================================
   DOWNLOAD FILE
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        filename;


    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        30000
    );

}


/* =========================================================
   BUTTON
========================================================= */

downloadVideo.addEventListener(
    "click",
    createVideo
);


/* =========================================================
   START
========================================================= */

(async function(){

    try{

        await loadFont();

        await loadPoster();


        const format =
            getVideoFormat();


        if(format){

            statusText.innerText =

                `Your browser supports ${format.extension.toUpperCase()} video recording.`;

        }
        else{

            statusText.innerText =
                "Video recording is not supported by this browser.";

        }

    }
    catch(error){

        console.error(
            error
        );


        alert(
            error.message
        );

    }

})();


</script>

</body>
</html>
