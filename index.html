<!DOCTYPE html>
<html lang="gu">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Personalised Poster</title>


<!-- =====================================================
     MOGRA FONT
===================================================== -->

<link
    rel="preconnect"
    href="https://fonts.googleapis.com"
>

<link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
>

<link
    href="https://fonts.googleapis.com/css2?family=Mogra&display=swap"
    rel="stylesheet"
>


<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f3f3f3;
    color:#222;
}

.container{
    max-width:600px;
    margin:auto;
    padding:18px;
}

h1{
    text-align:center;
    margin:5px 0 18px;
    font-size:24px;
}

.control-box{
    background:white;
    padding:18px;
    border-radius:15px;
    box-shadow:0 4px 15px rgba(0,0,0,.12);
    margin-bottom:20px;
}

label{
    display:block;
    font-weight:bold;
    margin:12px 0 6px;
}

input[type="text"],
input[type="file"]{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:16px;
}

button{
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

#downloadVideo{
    background:#e85d04;
    color:white;
}

#downloadPoster{
    background:#333;
    color:white;
}

button:disabled{
    opacity:.55;
    cursor:not-allowed;
}

.poster-wrapper{
    width:100%;
    background:white;
    padding:0;
    border-radius:5px;
    overflow:hidden;
    box-shadow:0 5px 25px rgba(0,0,0,.2);
}

#posterCanvas{
    width:100%;
    height:auto;
    display:block;
}

.progress{
    display:none;
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.progress-bar{
    width:100%;
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
    margin-top:8px;
}

.progress-fill{
    height:100%;
    width:0%;
    background:#e85d04;
    transition:width:.1s linear;
}

.note{
    font-size:13px;
    color:#666;
    text-align:center;
    margin-top:10px;
    line-height:1.5;
}

#status{
    font-size:13px;
    color:#666;
    text-align:center;
    margin-top:8px;
}

</style>

</head>


<body>


<div class="container">


<h1>
    તમારું Personalised Poster બનાવો
</h1>


<div class="control-box">


<label>
    તમારો ફોટો Upload કરો
</label>

<input
    type="file"
    id="photoInput"
    accept="image/*"
>


<label>
    તમારું નામ
</label>

<input
    type="text"
    id="nameInput"
    placeholder="તમારું નામ લખો"
>


<label>
    પ્રવાસમાં જવાનું ગામ
</label>

<input
    type="text"
    id="villageInput"
    placeholder="ગામનું નામ લખો"
>


<button id="downloadVideo">

🎬 Download Poster MP4 Video

</button>


<button id="downloadPoster">

🖼️ Download Poster Image

</button>


<div
    class="progress"
    id="progressBox"
>

    <div id="progressText">
        Video તૈયાર થઈ રહ્યું છે...
    </div>

    <div class="progress-bar">

        <div
            class="progress-fill"
            id="progressFill">
        </div>

    </div>

</div>


<div id="status"></div>


<div class="note">

    Video માં poster સાથે audio ના પ્રથમ 30 seconds રહેશે.

</div>


</div>


<div class="poster-wrapper">

<canvas
    id="posterCanvas"
    width="928"
    height="1640">
</canvas>

</div>


</div>


<script>


/* =====================================================
   BASIC SETTINGS
===================================================== */

const POSTER_WIDTH = 928;

const POSTER_HEIGHT = 1640;

const VIDEO_SECONDS = 30;

const POSTER_FILE = "poster.jpg";

const AUDIO_FILE = "audio.mp3";


/* =====================================================
   PHOTO POSITION
===================================================== */

const PHOTO_BOX = {

    x:638,

    y:1290,

    width:270,

    height:270

};


/* =====================================================
   NAME POSITION
===================================================== */

const NAME_POSITION = {

    x:773,

    y:1615,

    maxWidth:240,

    fontSize:48,

    minFontSize:25

};


/* =====================================================
   VILLAGE POSITION
===================================================== */

const VILLAGE_POSITION = {

    x:632,

    y:1095,

    width:280,

    height:45,

    fontSize:35,

    color:"#832404"

};


/* =====================================================
   ELEMENTS
===================================================== */

const canvas =
    document.getElementById("posterCanvas");

const ctx =
    canvas.getContext("2d");

const photoInput =
    document.getElementById("photoInput");

const nameInput =
    document.getElementById("nameInput");

const villageInput =
    document.getElementById("villageInput");

const downloadVideo =
    document.getElementById("downloadVideo");

const downloadPoster =
    document.getElementById("downloadPoster");

const progressBox =
    document.getElementById("progressBox");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const status =
    document.getElementById("status");


/* =====================================================
   VARIABLES
===================================================== */

let posterImage = null;

let userPhoto = null;


/* =====================================================
   LOAD MOGRA
===================================================== */

async function loadMogra(){

    try{

        if(document.fonts){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log(
            "Mogra loading warning:",
            error
        );

    }

}


/* =====================================================
   LOAD POSTER
===================================================== */

async function loadPoster(){

    try{

        status.innerText =
            "Poster loading...";


        const response =
            await fetch(
                POSTER_FILE + "?v=" + Date.now()
            );


        if(!response.ok){

            throw new Error(
                "poster.jpg not found."
            );

        }


        const blob =
            await response.blob();


        const url =
            URL.createObjectURL(blob);


        await new Promise(
            function(resolve,reject){

                const img =
                    new Image();


                img.onload =
                    function(){

                        posterImage =
                            img;


                        URL.revokeObjectURL(
                            url
                        );


                        redraw();


                        resolve();

                    };


                img.onerror =
                    function(){

                        URL.revokeObjectURL(
                            url
                        );


                        reject(
                            new Error(
                                "Could not load poster.jpg."
                            )
                        );

                    };


                img.src =
                    url;

            }
        );


        status.innerText =
            "Poster ready.";

    }
    catch(error){

        console.error(error);


        alert(
            "Poster loading error:\n\n" +
            error.message +
            "\n\nMake sure poster.jpg is beside index.html."
        );

    }

}


/* =====================================================
   PHOTO UPLOAD
===================================================== */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                const img =
                    new Image();


                img.onload =
                    function(){

                        userPhoto =
                            img;


                        redraw();

                    };


                img.src =
                    event.target.result;

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   TEXT INPUT
===================================================== */

nameInput.addEventListener(
    "input",
    redraw
);


villageInput.addEventListener(
    "input",
    redraw
);


/* =====================================================
   DRAW PHOTO
===================================================== */

function drawPhoto(){

    if(!userPhoto)
        return;


    const boxX =
        PHOTO_BOX.x;

    const boxY =
        PHOTO_BOX.y;

    const boxW =
        PHOTO_BOX.width;

    const boxH =
        PHOTO_BOX.height;


    const imageRatio =
        userPhoto.width /
        userPhoto.height;


    const boxRatio =
        boxW /
        boxH;


    let drawW;

    let drawH;


    if(imageRatio > boxRatio){

        drawW =
            boxW;

        drawH =
            drawW /
            imageRatio;

    }
    else{

        drawH =
            boxH;

        drawW =
            drawH *
            imageRatio;

    }


    const drawX =
        boxX +
        (boxW - drawW) / 2;


    const drawY =
        boxY +
        (boxH - drawH) / 2;


    ctx.save();


    ctx.beginPath();


    ctx.rect(
        boxX,
        boxY,
        boxW,
        boxH
    );


    ctx.clip();


    ctx.drawImage(

        userPhoto,

        drawX,
        drawY,

        drawW,
        drawH

    );


    ctx.restore();

}


/* =====================================================
   DRAW NAME
===================================================== */

function drawName(){

    const name =
        nameInput.value.trim();


    if(!name)
        return;


    let fontSize =
        NAME_POSITION.fontSize;


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.font =
        `bold ${fontSize}px Arial`;


    while(

        ctx.measureText(name).width >
        NAME_POSITION.maxWidth

        &&

        fontSize >
        NAME_POSITION.minFontSize

    ){

        fontSize--;


        ctx.font =
            `bold ${fontSize}px Arial`;

    }


    ctx.shadowColor =
        "rgba(0,0,0,.18)";


    ctx.shadowBlur =
        3;


    ctx.fillStyle =
        "#8f2e0f";


    ctx.fillText(

        name,

        NAME_POSITION.x,

        NAME_POSITION.y

    );


    ctx.shadowBlur = 0;

}


/* =====================================================
   DRAW VILLAGE
===================================================== */

function drawVillage(){

    const village =
        villageInput.value.trim();


    if(!village)
        return;


    ctx.save();


    ctx.font =
        `35px "Mogra", Arial, sans-serif`;


    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        VILLAGE_POSITION.color;


    ctx.shadowColor =
        "rgba(0,0,0,.15)";


    ctx.shadowBlur =
        2;


    const centerX =
        VILLAGE_POSITION.x +
        VILLAGE_POSITION.width / 2;


    const centerY =
        VILLAGE_POSITION.y +
        VILLAGE_POSITION.height / 2;


    ctx.fillText(

        village,

        centerX,

        centerY

    );


    ctx.restore();

}


/* =====================================================
   REDRAW POSTER
===================================================== */

function redraw(){

    if(!posterImage)
        return;


    ctx.clearRect(
        0,
        0,
        POSTER_WIDTH,
        POSTER_HEIGHT
    );


    ctx.drawImage(

        posterImage,

        0,
        0,

        POSTER_WIDTH,
        POSTER_HEIGHT

    );


    drawPhoto();

    drawVillage();

    drawName();

}


/* =====================================================
   DOWNLOAD IMAGE
===================================================== */

downloadPoster.addEventListener(
    "click",
    function(){

        if(!posterImage){

            alert(
                "Poster is still loading."
            );

            return;

        }


        redraw();


        canvas.toBlob(
            function(blob){

                if(!blob){

                    alert(
                        "Could not create poster image."
                    );

                    return;

                }


                downloadBlob(
                    blob,
                    "personalised-poster.png"
                );

            },
            "image/png"
        );

    }
);


/* =====================================================
   DOWNLOAD BLOB
===================================================== */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        filename;


    document.body.appendChild(a);


    a.click();


    a.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        10000
    );

}


/* =====================================================
   LOAD AUDIO
===================================================== */

async function loadAudio(){

    const response =
        await fetch(
            AUDIO_FILE + "?v=" + Date.now()
        );


    if(!response.ok){

        throw new Error(
            "audio.mp3 not found."
        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContextClass){

        throw new Error(
            "Your browser does not support Web Audio."
        );

    }


    const audioContext =
        new AudioContextClass();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    return {

        audioContext,
        audioBuffer

    };

}


/* =====================================================
   FIND BEST MP4 MIME TYPE
===================================================== */

function getMP4MimeType(){

    const types = [

        "video/mp4;codecs=\"avc1.42E01E,mp4a.40.2\"",

        "video/mp4;codecs=\"avc1.4D401E,mp4a.40.2\"",

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm"

    ];


    for(
        const type of types
    ){

        try{

            if(
                MediaRecorder.isTypeSupported(type)
            ){

                return type;

            }

        }
        catch(error){}

    }


    return null;

}


/* =====================================================
   RECORD VIDEO
===================================================== */

async function recordVideo(){

    const {

        audioContext,

        audioBuffer

    } = await loadAudio();


    /*
       Canvas video stream
    */

    const canvasStream =
        canvas.captureStream(15);


    /*
       Audio stream
    */

    const audioDestination =
        audioContext
        .createMediaStreamDestination();


    const audioSource =
        audioContext
        .createBufferSource();


    audioSource.buffer =
        audioBuffer;


    audioSource.connect(
        audioDestination
    );


    /*
       Combined stream
    */

    const stream =
        new MediaStream();


    canvasStream
        .getVideoTracks()
        .forEach(
            function(track){

                stream.addTrack(track);

            }
        );


    audioDestination
        .stream
        .getAudioTracks()
        .forEach(
            function(track){

                stream.addTrack(track);

            }
        );


    /*
       Select MP4 first.
    */

    const mimeType =
        getMP4MimeType();


    if(!mimeType){

        stream.getTracks()
            .forEach(
                track=>track.stop()
            );


        await audioContext.close();


        throw new Error(

            "This browser does not support MP4 recording.\n\n" +

            "Please use the latest Safari or Chrome."

        );

    }


    console.log(
        "Recording format:",
        mimeType
    );


    /*
       Create recorder
    */

    let recorder;


    try{

        recorder =
            new MediaRecorder(

                stream,

                {

                    mimeType:
                        mimeType,

                    videoBitsPerSecond:
                        1800000,

                    audioBitsPerSecond:
                        128000

                }

            );

    }
    catch(error){

        stream.getTracks()
            .forEach(
                track=>track.stop()
            );


        await audioContext.close();


        throw new Error(

            "MP4 recorder could not start.\n\n" +

            error.message

        );

    }


    const chunks = [];


    recorder.ondataavailable =
        function(event){

            if(

                event.data &&

                event.data.size > 0

            ){

                chunks.push(
                    event.data
                );

            }

        };


    const stopped =
        new Promise(
            function(resolve){

                recorder.onstop =
                    resolve;

            }
        );


    /*
       Start recording
    */

    recorder.start(1000);


    await audioContext.resume();


    audioSource.start(0);


    const startTime =
        performance.now();


    /*
       30 second recording
    */

    await new Promise(
        function(resolve){

            function update(){

                const elapsed =
                    (
                        performance.now() -
                        startTime
                    ) / 1000;


                const percent =
                    Math.min(

                        100,

                        (
                            elapsed /
                            VIDEO_SECONDS
                        ) * 100

                    );


                progressFill.style.width =
                    percent + "%";


                progressText.innerText =
                    "Poster video બનાવાઈ રહ્યું છે... " +
                    Math.floor(percent) +
                    "%";


                if(
                    elapsed >=
                    VIDEO_SECONDS
                ){

                    resolve();

                }
                else{

                    requestAnimationFrame(
                        update
                    );

                }

            }


            update();

        }
    );


    /*
       Stop audio
    */

    try{

        audioSource.stop();

    }
    catch(error){}


    /*
       Stop recorder
    */

    recorder.stop();


    await stopped;


    /*
       Stop tracks
    */

    stream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    canvasStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    try{

        await audioContext.close();

    }
    catch(error){}


    /*
       Determine actual output type.
    */

    let outputType =
        mimeType;


    if(
        chunks.length > 0 &&
        chunks[0].type
    ){

        outputType =
            chunks[0].type;

    }


    return new Blob(

        chunks,

        {
            type:outputType
        }

    );

}


/* =====================================================
   CREATE VIDEO
===================================================== */

async function createVideo(){

    /*
       Check photo
    */

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    /*
       Check name
    */

    if(
        !nameInput.value.trim()
    ){

        alert(
            "Please enter your name."
        );

        return;

    }


    /*
       Check village
    */

    if(
        !villageInput.value.trim()
    ){

        alert(
            "Please enter the village name."
        );

        return;

    }


    /*
       Disable buttons
    */

    downloadVideo.disabled =
        true;

    downloadPoster.disabled =
        true;


    progressBox.style.display =
        "block";


    progressFill.style.width =
        "0%";


    status.innerText =
        "Preparing MP4 video...";


    try{

        /*
           Make sure Mogra is loaded
        */

        await loadMogra();


        /*
           Draw final poster
        */

        redraw();


        /*
           Test canvas
        */

        try{

            canvas.toDataURL(
                "image/png"
            );

        }
        catch(error){

            throw new Error(

                "Canvas error.\n\n" +

                "Please use your GitHub Pages HTTPS URL."

            );

        }


        /*
           Record directly as MP4
        */

        const videoBlob =
            await recordVideo();


        if(
            !videoBlob ||
            videoBlob.size === 0
        ){

            throw new Error(
                "MP4 video could not be created."
            );

        }


        /*
           Check whether browser actually
           produced MP4.
        */

        const isMP4 =
            videoBlob.type
            .toLowerCase()
            .includes("mp4");


        if(!isMP4){

            throw new Error(

                "Your browser returned " +
                videoBlob.type +
                " instead of MP4.\n\n" +

                "Please update Safari to the latest version."

            );

        }


        /*
           Complete
        */

        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ MP4 તૈયાર છે — Download શરૂ થઈ રહ્યું છે...";


        status.innerText =
            "✅ MP4 successfully created.";


        /*
           Download
        */

        downloadBlob(
            videoBlob,
            "personalised-poster-video.mp4"
        );

    }
    catch(error){

        console.error(
            "VIDEO ERROR:",
            error
        );


        alert(

            "MP4 download error:\n\n" +

            error.message

        );


        status.innerText =
            "MP4 creation failed.";

    }
    finally{

        downloadVideo.disabled =
            false;

        downloadPoster.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            5000
        );

    }

}


/* =====================================================
   VIDEO BUTTON
===================================================== */

downloadVideo.addEventListener(
    "click",
    createVideo
);


/* =====================================================
   START
===================================================== */

(async function(){

    await loadMogra();

    await loadPoster();

})();

</script>


</body>
</html>
