<script>

/* =========================================================
   SETTINGS
========================================================= */

const POSTER_WIDTH = 928;
const POSTER_HEIGHT = 1640;

const POSTER_FILE = "poster.jpg";
const AUDIO_FILE = "audio.mp3";


/* =========================================================
   PHOTO POSITION
========================================================= */

const PHOTO_BOX = {
    x: 638,
    y: 1290,
    width: 270,
    height: 270
};


/* =========================================================
   NAME POSITION
========================================================= */

const NAME_POSITION = {
    x: 773,
    y: 1615,
    maxWidth: 240,
    fontSize: 48,
    minFontSize: 25
};


/* =========================================================
   VILLAGE POSITION
========================================================= */

const VILLAGE_POSITION = {
    x: 632,
    y: 1095,
    width: 280,
    height: 45,
    fontSize: 35,
    color: "#832404"
};


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("posterCanvas");

const ctx =
    canvas.getContext("2d");

const photoInput =
    document.getElementById("photoInput");

const nameInput =
    document.getElementById("nameInput");

const villageInput =
    document.getElementById("villageInput");

const downloadVideo =
    document.getElementById("downloadVideo");

const downloadPoster =
    document.getElementById("downloadPoster");

const progressBox =
    document.getElementById("progressBox");

const progressText =
    document.getElementById("progressText");

const progressFill =
    document.getElementById("progressFill");

const statusText =
    document.getElementById("statusText");


/* =========================================================
   VARIABLES
========================================================= */

let posterImage = null;
let userPhoto = null;


/* =========================================================
   LOAD FONT
========================================================= */

async function loadFont(){

    try{

        if(document.fonts){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log("Font warning:", error);

    }

}


/* =========================================================
   LOAD POSTER
========================================================= */

async function loadPoster(){

    const response =
        await fetch(
            POSTER_FILE + "?v=" + Date.now()
        );

    if(!response.ok){

        throw new Error(
            "poster.jpg not found.\n\n" +
            "Please put poster.jpg in the same folder as index.html."
        );

    }

    const blob =
        await response.blob();

    const url =
        URL.createObjectURL(blob);

    await new Promise(
        (resolve,reject)=>{

            const img =
                new Image();

            img.onload = function(){

                posterImage = img;

                URL.revokeObjectURL(url);

                redraw();

                resolve();

            };

            img.onerror = function(){

                URL.revokeObjectURL(url);

                reject(
                    new Error(
                        "poster.jpg could not be loaded."
                    )
                );

            };

            img.src = url;

        }
    );

}


/* =========================================================
   PHOTO UPLOAD
========================================================= */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file)
            return;

        if(!file.type.startsWith("image/")){

            alert("Please select an image.");

            return;

        }

        const reader =
            new FileReader();

        reader.onload =
            function(event){

                const img =
                    new Image();

                img.onload =
                    function(){

                        userPhoto = img;

                        redraw();

                    };

                img.src =
                    event.target.result;

            };

        reader.readAsDataURL(file);

    }
);


/* =========================================================
   INPUT EVENTS
========================================================= */

nameInput.addEventListener(
    "input",
    redraw
);

villageInput.addEventListener(
    "input",
    redraw
);


/* =========================================================
   DRAW PHOTO
========================================================= */

function drawPhoto(){

    if(!userPhoto)
        return;

    const boxX =
        PHOTO_BOX.x;

    const boxY =
        PHOTO_BOX.y;

    const boxW =
        PHOTO_BOX.width;

    const boxH =
        PHOTO_BOX.height;

    const imageRatio =
        userPhoto.width /
        userPhoto.height;

    const boxRatio =
        boxW /
        boxH;

    let drawW;
    let drawH;

    if(imageRatio > boxRatio){

        drawW = boxW;

        drawH =
            drawW /
            imageRatio;

    }
    else{

        drawH = boxH;

        drawW =
            drawH *
            imageRatio;

    }

    const drawX =
        boxX +
        (boxW - drawW) / 2;

    const drawY =
        boxY +
        (boxH - drawH) / 2;

    ctx.save();

    ctx.beginPath();

    ctx.rect(
        boxX,
        boxY,
        boxW,
        boxH
    );

    ctx.clip();

    ctx.drawImage(
        userPhoto,
        drawX,
        drawY,
        drawW,
        drawH
    );

    ctx.restore();

}


/* =========================================================
   DRAW NAME
========================================================= */

function drawName(){

    const name =
        nameInput.value.trim();

    if(!name)
        return;

    let size =
        NAME_POSITION.fontSize;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        `bold ${size}px Arial`;

    while(

        ctx.measureText(name).width >
        NAME_POSITION.maxWidth

        &&

        size >
        NAME_POSITION.minFontSize

    ){

        size--;

        ctx.font =
            `bold ${size}px Arial`;

    }

    ctx.fillStyle =
        "#8f2e0f";

    ctx.shadowColor =
        "rgba(0,0,0,.18)";

    ctx.shadowBlur =
        3;

    ctx.fillText(
        name,
        NAME_POSITION.x,
        NAME_POSITION.y
    );

    ctx.shadowBlur = 0;

}


/* =========================================================
   DRAW VILLAGE
========================================================= */

function drawVillage(){

    const village =
        villageInput.value.trim();

    if(!village)
        return;

    ctx.save();

    let size =
        VILLAGE_POSITION.fontSize;

    ctx.textAlign =
        "center";

    ctx.textBaseline =
        "middle";

    ctx.font =
        `${size}px "Mogra", Arial, sans-serif`;

    while(

        ctx.measureText(village).width >
        VILLAGE_POSITION.width

        &&

        size > 20

    ){

        size--;

        ctx.font =
            `${size}px "Mogra", Arial, sans-serif`;

    }

    ctx.fillStyle =
        VILLAGE_POSITION.color;

    ctx.shadowColor =
        "rgba(0,0,0,.15)";

    ctx.shadowBlur = 2;

    const centerX =
        VILLAGE_POSITION.x +
        VILLAGE_POSITION.width / 2;

    const centerY =
        VILLAGE_POSITION.y +
        VILLAGE_POSITION.height / 2;

    ctx.fillText(
        village,
        centerX,
        centerY
    );

    ctx.restore();

}


/* =========================================================
   REDRAW
========================================================= */

function redraw(){

    if(!posterImage)
        return;

    ctx.clearRect(
        0,
        0,
        POSTER_WIDTH,
        POSTER_HEIGHT
    );

    /*
       Draw original poster.
    */

    ctx.drawImage(
        posterImage,
        0,
        0,
        POSTER_WIDTH,
        POSTER_HEIGHT
    );

    /*
       Add visitor photo.
    */

    drawPhoto();

    /*
       Add village.
    */

    drawVillage();

    /*
       Add name.
    */

    drawName();

}


/* =========================================================
   DOWNLOAD POSTER IMAGE
========================================================= */

downloadPoster.addEventListener(
    "click",
    function(){

        redraw();

        canvas.toBlob(
            function(blob){

                if(!blob){

                    alert(
                        "Poster image could not be created."
                    );

                    return;

                }

                downloadBlob(
                    blob,
                    "personalised-poster.png"
                );

            },
            "image/png"
        );

    }
);


/* =========================================================
   LOAD AUDIO
========================================================= */

async function loadAudio(){

    const response =
        await fetch(
            AUDIO_FILE + "?v=" + Date.now()
        );

    if(!response.ok){

        throw new Error(

            "audio.mp3 not found.\n\n" +

            "Please put audio.mp3 in the same folder as index.html."

        );

    }

    const arrayBuffer =
        await response.arrayBuffer();

    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;

    if(!AudioContextClass){

        throw new Error(
            "Web Audio is not supported by this browser."
        );

    }

    const audioContext =
        new AudioContextClass();

    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );

    return {
        audioContext,
        audioBuffer
    };

}


/* =========================================================
   GET AUDIO DURATION
========================================================= */

async function getAudioDuration(){

    const audio =
        await loadAudio();

    const duration =
        audio.audioBuffer.duration;

    await audio.audioContext.close();

    return duration;

}


/* =========================================================
   SELECT BEST RECORDING FORMAT
========================================================= */

function getRecordingFormat(){

    /*
       Safari:
       Prefer MP4/H.264 + AAC.
    */

    const mp4Formats = [

        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

        'video/mp4;codecs="avc1.4D401E,mp4a.40.2"',

        "video/mp4"

    ];

    for(
        const type of mp4Formats
    ){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            return {
                mimeType: type,
                extension: "mp4"
            };

        }

    }


    /*
       Chrome:
       Prefer WebM.
    */

    const webmFormats = [

        'video/webm;codecs="vp9,opus"',

        'video/webm;codecs="vp8,opus"',

        "video/webm"

    ];

    for(
        const type of webmFormats
    ){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            return {
                mimeType: type,
                extension: "webm"
            };

        }

    }

    return null;

}


/* =========================================================
   CREATE AUDIO STREAM
========================================================= */

async function createAudioStream(){

    const {
        audioContext,
        audioBuffer
    } =
        await loadAudio();

    const destination =
        audioContext
        .createMediaStreamDestination();

    const source =
        audioContext
        .createBufferSource();

    source.buffer =
        audioBuffer;

    /*
       Connect audio to recorder.
    */

    source.connect(
        destination
    );

    await audioContext.resume();

    return {
        audioContext,
        audioBuffer,
        destination,
        source
    };

}


/* =========================================================
   CREATE VIDEO
========================================================= */

async function createVideo(){

    /*
       Validate photo.
    */

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    /*
       Validate name.
    */

    if(!nameInput.value.trim()){

        alert(
            "Please enter your name."
        );

        return;

    }


    /*
       Validate village.
    */

    if(!villageInput.value.trim()){

        alert(
            "Please enter the village name."
        );

        return;

    }


    if(
        typeof MediaRecorder ===
        "undefined"
    ){

        alert(
            "Your browser does not support video recording."
        );

        return;

    }


    const format =
        getRecordingFormat();

    if(!format){

        alert(

            "This browser cannot create a video.\n\n" +

            "Please use the latest Safari or Chrome."

        );

        return;

    }


    /*
       Disable buttons.
    */

    downloadVideo.disabled =
        true;

    downloadPoster.disabled =
        true;


    progressBox.style.display =
        "block";

    progressFill.style.width =
        "0%";


    let canvasStream = null;
    let audioData = null;
    let recorder = null;


    try{

        await loadFont();

        redraw();


        /*
           Get the ACTUAL audio duration.

           No fixed 30 second limit.
        */

        const duration =
            await getAudioDuration();


        if(
            !duration ||
            duration <= 0
        ){

            throw new Error(
                "Could not determine audio duration."
            );

        }


        statusText.innerText =

            `Audio length: ${formatTime(duration)} | ` +
            `Video format: ${format.extension.toUpperCase()}`;


        /*
           Canvas → video.
        */

        canvasStream =
            canvas.captureStream(20);


        /*
           Audio → audio track.
        */

        audioData =
            await createAudioStream();


        /*
           Combine video + audio.
        */

        const finalStream =
            new MediaStream();


        const videoTracks =
            canvasStream.getVideoTracks();

        videoTracks.forEach(
            function(track){

                finalStream.addTrack(track);

            }
        );


        const audioTracks =
            audioData
            .destination
            .stream
            .getAudioTracks();

        audioTracks.forEach(
            function(track){

                finalStream.addTrack(track);

            }
        );


        /*
           Create recorder.
        */

        recorder =
            new MediaRecorder(

                finalStream,

                {
                    mimeType:
                        format.mimeType,

                    videoBitsPerSecond:
                        2000000,

                    audioBitsPerSecond:
                        128000
                }

            );


        const chunks = [];


        recorder.ondataavailable =
            function(event){

                if(
                    event.data &&
                    event.data.size > 0
                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        /*
           Promise for recorder stop.
        */

        const recorderStopped =
            new Promise(
                function(resolve,reject){

                    recorder.onstop =
                        resolve;

                    recorder.onerror =
                        function(event){

                            reject(
                                event.error ||
                                new Error(
                                    "Video recorder failed."
                                )
                            );

                        };

                }
            );


        /*
           VERY IMPORTANT:

           Start recorder FIRST.
        */

        recorder.start(250);


        /*
           Give recorder a moment to start.
        */

        await sleep(300);


        /*
           Start audio AFTER recorder.
        */

        audioData.source.start(0);


        const startTime =
            performance.now();


        /*
           Wait for FULL audio duration.
        */

        await new Promise(
            function(resolve){

                function update(){

                    const elapsed =
                        (
                            performance.now()
                            -
                            startTime
                        ) / 1000;


                    const percentage =
                        Math.min(
                            100,
                            (
                                elapsed /
                                duration
                            ) * 100
                        );


                    progressFill.style.width =
                        percentage + "%";


                    progressText.innerText =

                        `Poster video બનાવાઈ રહ્યું છે... ` +
                        `${Math.floor(percentage)}%`;


                    if(
                        elapsed >= duration
                    ){

                        resolve();

                    }
                    else{

                        requestAnimationFrame(
                            update
                        );

                    }

                }

                update();

            }
        );


        /*
           Small safety delay.

           This helps Safari finish
           the last audio packet.
        */

        await sleep(500);


        /*
           Stop audio.
        */

        try{

            audioData.source.stop();

        }
        catch(error){}


        /*
           STOP RECORDER.
        */

        recorder.stop();


        /*
           WAIT until recorder has
           completely finished.
        */

        await recorderStopped;


        /*
           Create final video Blob.
        */

        const videoBlob =
            new Blob(
                chunks,
                {
                    type:
                        recorder.mimeType ||
                        format.mimeType
                }
            );


        /*
           IMPORTANT:

           Do NOT reject the file merely
           because it is small.

           Safari can create smaller MP4s
           for a mostly static poster.
        */

        if(
            !videoBlob ||
            videoBlob.size === 0
        ){

            throw new Error(
                "The browser did not create a video file."
            );

        }


        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Full video તૈયાર છે";


        /*
           Correct extension.
        */

        const filename =

            "personalised-poster-video." +
            format.extension;


        /*
           Download.
        */

        downloadBlob(
            videoBlob,
            filename
        );


        statusText.innerText =

            `✅ Full ${format.extension.toUpperCase()} video downloaded. ` +
            `Duration: ${formatTime(duration)}`;


    }
    catch(error){

        console.error(
            "VIDEO ERROR:",
            error
        );


        alert(

            "Video બનાવવામાં error આવ્યો:\n\n" +

            error.message

        );

    }
    finally{

        /*
           Stop video tracks.
        */

        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        /*
           Close audio context.
        */

        if(audioData){

            try{

                await audioData
                    .audioContext
                    .close();

            }
            catch(error){}

        }


        /*
           Enable buttons.
        */

        downloadVideo.disabled =
            false;

        downloadPoster.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            4000
        );

    }

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(milliseconds){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                milliseconds
            );

        }
    );

}


/* =========================================================
   FORMAT TIME
========================================================= */

function formatTime(seconds){

    const total =
        Math.round(seconds);

    const minutes =
        Math.floor(
            total / 60
        );

    const secs =
        total % 60;

    return (

        String(minutes).padStart(2,"0") +
        ":" +
        String(secs).padStart(2,"0")

    );

}


/* =========================================================
   DOWNLOAD BLOB
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;

    link.download =
        filename;

    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();


    document.body.removeChild(
        link
    );


    /*
       Keep URL alive long enough
       for Safari/Chrome download.
    */

    setTimeout(
        function(){

            URL.revokeObjectURL(url);

        },
        60000
    );

}


/* =========================================================
   BUTTON
========================================================= */

downloadVideo.addEventListener(
    "click",
    createVideo
);


/* =========================================================
   START WEBSITE
========================================================= */

(async function(){

    try{

        await loadFont();

        await loadPoster();


        if(
            typeof MediaRecorder !==
            "undefined"
        ){

            const format =
                getRecordingFormat();


            if(format){

                statusText.innerText =

                    `Ready — ${format.extension.toUpperCase()} video ` +
                    `will contain the complete audio.`;

            }
            else{

                statusText.innerText =
                    "Video recording is not supported.";

            }

        }

    }
    catch(error){

        console.error(
            error
        );

        alert(
            error.message
        );

    }

})();

</script>
