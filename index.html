<script>

/* =========================================================
   BASIC SETTINGS
========================================================= */

const POSTER_WIDTH = 928;

const POSTER_HEIGHT = 1640;

const VIDEO_SECONDS = 30;

const POSTER_FILE = "poster.jpg";

const AUDIO_FILE = "audio.mp3";


/* =========================================================
   PHOTO FRAME
========================================================= */

const PHOTO_BOX = {

    x:638,

    y:1290,

    width:270,

    height:270

};


/* =========================================================
   NAME POSITION
========================================================= */

const NAME_POSITION = {

    x:773,

    y:1615,

    maxWidth:240,

    fontSize:48,

    minFontSize:25

};


/* =========================================================
   VILLAGE POSITION
========================================================= */

const VILLAGE_POSITION = {

    x:632,

    y:1095,

    width:280,

    height:45,

    fontSize:35,

    color:"#832404",

    fontFamily:"Mogra"

};


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById("posterCanvas");


const ctx =
    canvas.getContext("2d");


const photoInput =
    document.getElementById("photoInput");


const nameInput =
    document.getElementById("nameInput");


const villageInput =
    document.getElementById("villageInput");


const downloadVideo =
    document.getElementById("downloadVideo");


const downloadPoster =
    document.getElementById("downloadPoster");


const progressBox =
    document.getElementById("progressBox");


const progressText =
    document.getElementById("progressText");


const progressFill =
    document.getElementById("progressFill");


const ffmpegStatus =
    document.getElementById("ffmpegStatus");


/* =========================================================
   VARIABLES
========================================================= */

let posterImage = null;

let userPhoto = null;

let ffmpeg = null;

let ffmpegLoaded = false;


/* =========================================================
   MOGRA FONT
========================================================= */

async function loadMograFont(){

    try{

        if(
            document.fonts &&
            document.fonts.load
        ){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log(
            "Mogra font warning:",
            error
        );

    }

}


/* =========================================================
   LOAD POSTER
========================================================= */

async function loadPoster(){

    try{

        const response =
            await fetch(
                POSTER_FILE,
                {
                    cache:"no-store"
                }
            );


        if(!response.ok){

            throw new Error(
                "poster.jpg not found. Put poster.jpg beside index.html."
            );

        }


        const posterBlob =
            await response.blob();


        /*
           Convert poster to local Blob URL.

           This prevents canvas tainting.
        */

        const posterURL =
            URL.createObjectURL(
                posterBlob
            );


        await new Promise(
            (resolve,reject)=>{

                const img =
                    new Image();


                img.onload =
                    function(){

                        posterImage =
                            img;


                        URL.revokeObjectURL(
                            posterURL
                        );


                        redraw();

                        resolve();

                    };


                img.onerror =
                    function(){

                        URL.revokeObjectURL(
                            posterURL
                        );


                        reject(
                            new Error(
                                "Could not load poster.jpg."
                            )
                        );

                    };


                img.src =
                    posterURL;

            }
        );

    }
    catch(error){

        console.error(
            "POSTER ERROR:",
            error
        );


        if(
            window.location.protocol === "file:"
        ){

            throw new Error(

                "Please open the GitHub Pages HTTPS URL.\n\n" +

                "Do not open index.html directly using file://."

            );

        }


        throw error;

    }

}


/* =========================================================
   PHOTO UPLOAD
========================================================= */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file)
            return;


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                const img =
                    new Image();


                img.onload =
                    function(){

                        userPhoto =
                            img;


                        redraw();

                    };


                img.src =
                    e.target.result;

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================================
   TEXT INPUT
========================================================= */

nameInput.addEventListener(
    "input",
    redraw
);


villageInput.addEventListener(
    "input",
    redraw
);


/* =========================================================
   PHOTO DRAWING
========================================================= */

function drawPhotoContain(){

    if(!userPhoto)
        return;


    const boxX =
        PHOTO_BOX.x;


    const boxY =
        PHOTO_BOX.y;


    const boxW =
        PHOTO_BOX.width;


    const boxH =
        PHOTO_BOX.height;


    const imageRatio =
        userPhoto.width /
        userPhoto.height;


    const boxRatio =
        boxW /
        boxH;


    let drawW;

    let drawH;


    if(
        imageRatio >
        boxRatio
    ){

        drawW =
            boxW;


        drawH =
            drawW /
            imageRatio;

    }
    else{

        drawH =
            boxH;


        drawW =
            drawH *
            imageRatio;

    }


    const drawX =
        boxX +
        (boxW - drawW) / 2;


    const drawY =
        boxY +
        (boxH - drawH) / 2;


    ctx.save();


    ctx.beginPath();


    ctx.rect(
        boxX,
        boxY,
        boxW,
        boxH
    );


    ctx.clip();


    ctx.drawImage(

        userPhoto,

        drawX,

        drawY,

        drawW,

        drawH

    );


    ctx.restore();

}


/* =========================================================
   NAME
========================================================= */

function drawName(){

    const name =
        nameInput.value.trim();


    if(!name)
        return;


    let fontSize =
        NAME_POSITION.fontSize;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        `bold ${fontSize}px Arial`;


    /*
       Automatically shrink long names.
    */

    while(

        ctx.measureText(name).width >
        NAME_POSITION.maxWidth

        &&

        fontSize >
        NAME_POSITION.minFontSize

    ){

        fontSize--;


        ctx.font =
            `bold ${fontSize}px Arial`;

    }


    ctx.shadowColor =
        "rgba(0,0,0,.18)";


    ctx.shadowBlur =
        3;


    ctx.fillStyle =
        "#8f2e0f";


    ctx.fillText(

        name,

        NAME_POSITION.x,

        NAME_POSITION.y

    );


    ctx.shadowBlur =
        0;

}


/* =========================================================
   VILLAGE
========================================================= */

function drawVillage(){

    const village =
        villageInput.value.trim();


    if(!village)
        return;


    ctx.save();


    ctx.font =
        `35px "Mogra", Arial, sans-serif`;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.fillStyle =
        VILLAGE_POSITION.color;


    ctx.shadowColor =
        "rgba(0,0,0,.15)";


    ctx.shadowBlur =
        2;


    const villageCenterX =
        VILLAGE_POSITION.x +
        (
            VILLAGE_POSITION.width /
            2
        );


    const villageCenterY =
        VILLAGE_POSITION.y +
        (
            VILLAGE_POSITION.height /
            2
        );


    ctx.fillText(

        village,

        villageCenterX,

        villageCenterY

    );


    ctx.restore();

}


/* =========================================================
   REDRAW
========================================================= */

function redraw(){

    if(!posterImage)
        return;


    ctx.clearRect(

        0,

        0,

        POSTER_WIDTH,

        POSTER_HEIGHT

    );


    ctx.drawImage(

        posterImage,

        0,

        0,

        POSTER_WIDTH,

        POSTER_HEIGHT

    );


    drawPhotoContain();

    drawVillage();

    drawName();

}


/* =========================================================
   DOWNLOAD IMAGE
========================================================= */

downloadPoster.addEventListener(
    "click",
    function(){

        redraw();


        canvas.toBlob(

            function(blob){

                if(!blob){

                    alert(
                        "Could not create poster image."
                    );

                    return;

                }


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const a =
                    document.createElement("a");


                a.href =
                    url;


                a.download =
                    "personalised-poster.png";


                document.body.appendChild(
                    a
                );


                a.click();


                a.remove();


                setTimeout(
                    function(){

                        URL.revokeObjectURL(
                            url
                        );

                    },
                    1000
                );

            },

            "image/png"

        );

    }
);


/* =========================================================
   LOAD AUDIO
========================================================= */

async function loadAudio(){

    const response =
        await fetch(
            AUDIO_FILE,
            {
                cache:"no-store"
            }
        );


    if(!response.ok){

        throw new Error(

            "audio.mp3 not found.\n\n" +

            "Put audio.mp3 beside index.html."

        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContextClass){

        throw new Error(
            "Web Audio is not supported by this browser."
        );

    }


    const audioContext =
        new AudioContextClass();


    const audioBuffer =
        await audioContext.decodeAudioData(
            arrayBuffer
        );


    return {

        audioContext,

        audioBuffer

    };

}


/* =========================================================
   CREATE LOCAL BLOB URL
========================================================= */

async function makeBlobURL(
    url,
    mimeType
){

    const response =
        await fetch(
            url,
            {
                cache:"force-cache"
            }
        );


    if(!response.ok){

        throw new Error(

            "Could not load FFmpeg file:\n\n" +
            url

        );

    }


    const data =
        await response.arrayBuffer();


    const blob =
        new Blob(
            [data],
            {
                type:mimeType
            }
        );


    return URL.createObjectURL(
        blob
    );

}


/* =========================================================
   LOAD FFMPEG
=========================================================

   IMPORTANT FIX:

   DO NOT load:

   ffmpeg-core.worker.js

   from @ffmpeg/core.

   The single-threaded core package does not provide
   that worker file.

   Instead we load 814.ffmpeg.js from the main
   @ffmpeg/ffmpeg package using workerLoadURL.
========================================================= */

async function loadFFmpeg(){

    if(ffmpegLoaded)
        return;


    if(
        typeof FFmpegWASM === "undefined"
    ){

        throw new Error(

            "FFmpeg main library did not load.\n\n" +

            "Please check your internet connection."

        );

    }


    progressText.innerText =
        "FFmpeg converter loading...";


    ffmpegStatus.innerText =
        "FFmpeg converter is loading for the first time...";


    const {
        FFmpeg
    } =
        FFmpegWASM;


    ffmpeg =
        new FFmpeg();


    /*
       FFmpeg logs.
    */

    ffmpeg.on(
        "log",
        function({message}){

            console.log(
                "FFmpeg:",
                message
            );

        }
    );


    /*
       FFmpeg progress.
    */

    ffmpeg.on(
        "progress",
        function({progress}){

            if(
                progress >= 0 &&
                progress <= 1
            ){

                const percent =
                    Math.round(
                        progress * 100
                    );


                progressFill.style.width =
                    percent + "%";

            }

        }
    );


    /*
       IMPORTANT:

       Main FFmpeg package.
    */

    const ffmpegBaseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.15/dist/umd";


    /*
       Single-thread FFmpeg core.

       Do NOT add workerURL here.
    */

    const coreBaseURL =
        "https://cdn.jsdelivr.net/npm/@ffmpeg/core@0.12.10/dist/umd";


    progressText.innerText =
        "FFmpeg core loading...";


    /*
       Load the three required files.

       1. 814.ffmpeg.js = worker loader
       2. ffmpeg-core.js = FFmpeg core
       3. ffmpeg-core.wasm = WebAssembly binary
    */

    const workerLoadURL =
        await makeBlobURL(

            `${ffmpegBaseURL}/814.ffmpeg.js`,

            "text/javascript"

        );


    const coreURL =
        await makeBlobURL(

            `${coreBaseURL}/ffmpeg-core.js`,

            "text/javascript"

        );


    const wasmURL =
        await makeBlobURL(

            `${coreBaseURL}/ffmpeg-core.wasm`,

            "application/wasm"

        );


    /*
       THIS IS THE IMPORTANT FIX.

       workerLoadURL is used.

       workerURL is NOT used.
    */

    await ffmpeg.load({

        workerLoadURL:

            workerLoadURL,

        coreURL:

            coreURL,

        wasmURL:

            wasmURL

    });


    ffmpegLoaded =
        true;


    progressText.innerText =
        "FFmpeg converter ready.";


    ffmpegStatus.innerText =
        "MP4 converter ready.";

}


/* =========================================================
   SUPPORTED VIDEO FORMAT
========================================================= */

function getSupportedMimeType(){

    const types = [

        "video/mp4",

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm"

    ];


    for(
        const type of types
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return type;

        }

    }


    throw new Error(

        "This browser does not support video recording."

    );

}


/* =========================================================
   RECORD VIDEO
========================================================= */

async function recordWebM(){

    const {
        audioContext,
        audioBuffer
    } =
        await loadAudio();


    /*
       Canvas stream.
    */

    const canvasStream =
        canvas.captureStream(15);


    /*
       Audio destination.
    */

    const audioDestination =
        audioContext
        .createMediaStreamDestination();


    const audioSource =
        audioContext
        .createBufferSource();


    audioSource.buffer =
        audioBuffer;


    audioSource.connect(
        audioDestination
    );


    /*
       Combined stream.
    */

    const combinedStream =
        new MediaStream();


    canvasStream
        .getVideoTracks()
        .forEach(
            function(track){

                combinedStream.addTrack(
                    track
                );

            }
        );


    audioDestination
        .stream
        .getAudioTracks()
        .forEach(
            function(track){

                combinedStream.addTrack(
                    track
                );

            }
        );


    /*
       Choose format.

       Safari may choose MP4.

       Chrome/Firefox may choose WebM.
    */

    const mimeType =
        getSupportedMimeType();


    const recorder =
        new MediaRecorder(

            combinedStream,

            {

                mimeType:mimeType,

                videoBitsPerSecond:1800000,

                audioBitsPerSecond:128000

            }

        );


    const chunks = [];


    recorder.ondataavailable =
        function(event){

            if(

                event.data &&

                event.data.size > 0

            ){

                chunks.push(
                    event.data
                );

            }

        };


    const finished =
        new Promise(
            function(resolve){

                recorder.onstop =
                    resolve;

            }
        );


    /*
       Start recording.
    */

    recorder.start(1000);


    await audioContext.resume();


    audioSource.start(0);


    const startTime =
        performance.now();


    /*
       30 seconds.
    */

    await new Promise(
        function(resolve){

            function update(){

                const elapsed =
                    (
                        performance.now()
                        -
                        startTime
                    ) / 1000;


                const percent =
                    Math.min(

                        100,

                        (
                            elapsed /
                            VIDEO_SECONDS
                        ) * 100

                    );


                progressFill.style.width =
                    percent + "%";


                progressText.innerText =
                    `Poster video બનાવાઈ રહ્યું છે... ${Math.floor(percent)}%`;


                if(
                    elapsed >=
                    VIDEO_SECONDS
                ){

                    resolve();

                }
                else{

                    requestAnimationFrame(
                        update
                    );

                }

            }


            update();

        }
    );


    /*
       Stop audio.
    */

    try{

        audioSource.stop();

    }
    catch(error){}


    /*
       Stop recording.
    */

    recorder.stop();


    await finished;


    /*
       Stop tracks.
    */

    combinedStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    canvasStream
        .getTracks()
        .forEach(
            function(track){

                track.stop();

            }
        );


    try{

        await audioContext.close();

    }
    catch(error){}


    return {

        blob:

            new Blob(

                chunks,

                {
                    type:mimeType
                }

            ),

        mimeType:mimeType

    };

}


/* =========================================================
   CONVERT TO MP4
========================================================= */

async function convertToMP4(
    recordedVideo
){

    await loadFFmpeg();


    progressText.innerText =
        "Real MP4 conversion શરૂ થઈ રહ્યું છે...";


    progressFill.style.width =
        "0%";


    /*
       Convert recording to Uint8Array.
    */

    const inputData =
        new Uint8Array(

            await recordedVideo.blob.arrayBuffer()

        );


    /*
       Determine input extension.
    */

    const inputName =
        recordedVideo.mimeType.includes("mp4")

            ? "input.mp4"

            : "input.webm";


    /*
       Write input.
    */

    await ffmpeg.writeFile(

        inputName,

        inputData

    );


    /*
       Convert to H.264 + AAC MP4.
    */

    const exitCode =
        await ffmpeg.exec([

            "-i",

            inputName,


            "-c:v",

            "libx264",


            "-preset",

            "ultrafast",


            "-crf",

            "28",


            "-pix_fmt",

            "yuv420p",


            "-c:a",

            "aac",


            "-b:a",

            "128k",


            "-movflags",

            "+faststart",


            "output.mp4"

        ]);


    if(
        exitCode !== 0
    ){

        throw new Error(

            "FFmpeg could not create the MP4."

        );

    }


    /*
       Read output.
    */

    const outputData =
        await ffmpeg.readFile(
            "output.mp4"
        );


    /*
       Clean files.
    */

    try{

        await ffmpeg.deleteFile(
            inputName
        );

    }
    catch(error){}


    try{

        await ffmpeg.deleteFile(
            "output.mp4"
        );

    }
    catch(error){}


    /*
       Return final MP4.
    */

    return new Blob(

        [outputData],

        {
            type:"video/mp4"
        }

    );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement("a");


    a.href =
        url;


    a.download =
        filename;


    document.body.appendChild(
        a
    );


    a.click();


    a.remove();


    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        10000
    );

}


/* =========================================================
   CREATE VIDEO
========================================================= */

async function createVideo(){

    /*
       Check photo.
    */

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    /*
       Check name.
    */

    if(
        !nameInput.value.trim()
    ){

        alert(
            "Please enter your name."
        );

        return;

    }


    /*
       Check village.
    */

    if(
        !villageInput.value.trim()
    ){

        alert(
            "Please enter the village name."
        );

        return;

    }


    /*
       Disable buttons.
    */

    downloadVideo.disabled =
        true;


    downloadPoster.disabled =
        true;


    progressBox.style.display =
        "block";


    progressFill.style.width =
        "0%";


    try{

        /*
           Load Mogra.
        */

        await loadMograFont();


        /*
           Draw final poster.
        */

        redraw();


        /*
           Check canvas security.
        */

        try{

            canvas.toDataURL(
                "image/png"
            );

        }
        catch(error){

            throw new Error(

                "Canvas security error.\n\n" +

                "Please use the GitHub Pages HTTPS URL, " +

                "not file://."

            );

        }


        /*
           STEP 1

           Create 30-second video.
        */

        const recordedVideo =
            await recordWebM();


        if(

            !recordedVideo ||

            !recordedVideo.blob ||

            recordedVideo.blob.size === 0

        ){

            throw new Error(

                "Temporary video could not be created."

            );

        }


        /*
           STEP 2

           Convert to real MP4.
        */

        const mp4Blob =
            await convertToMP4(
                recordedVideo
            );


        if(

            !mp4Blob ||

            mp4Blob.size === 0

        ){

            throw new Error(

                "Final MP4 file is empty."

            );

        }


        /*
           STEP 3

           Download.
        */

        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Real MP4 તૈયાર છે — Download શરૂ થઈ રહ્યું છે...";


        downloadBlob(

            mp4Blob,

            "personalised-poster-video.mp4"

        );


        ffmpegStatus.innerText =
            "✅ MP4 successfully created.";


    }
    catch(error){

        console.error(
            "MP4 ERROR:",
            error
        );


        alert(

            "MP4 download error:\n\n" +

            error.message

        );

    }
    finally{

        downloadVideo.disabled =
            false;


        downloadPoster.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            5000
        );

    }

}

   BUTTON
========================================================= */

downloadVideo.addEventListener(
    "click",
    createVideo
);

    try{

        await loadPoster();

    }

        console.error(
            error
        );


        alert(
            error.message
        );

    }

})();
