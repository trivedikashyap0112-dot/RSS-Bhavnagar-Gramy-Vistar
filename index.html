<style>

*{
    box-sizing:border-box;
}


html,
body{
    margin:0;
    padding:0;
}


body{

    font-family:Arial,sans-serif;

    background:#f3f3f3;

    color:#222;

}


.container{

}


h1{

}


.control-box{

    background:#fff;

        0 4px 15px rgba(0,0,0,.12);

    margin-bottom:20px;

}


label{

    display:block;

    font-weight:bold;

    margin:12px 0 6px;

}


input[type="text"],
input[type="file"]{

    width:100%;

}

}

.poster-wrapper{

}


#posterCanvas{

.progress{

.progress-bar{

.status{

    text-align:center;

    color:#555;

}

</style>

<body>


<div class="container">


<h1>
તમારું Personalised Poster બનાવો
</h1>


<div class="control-box">


<!-- =========================
     PHOTO
========================= -->

<label>
તમારો ફોટો Upload કરો
</label>


<input
    type="file"
    id="photoInput"
    accept="image/*"
>

     NAME
========================= -->

તમારું નામ
</label>


<input
    type="text"
    id="nameInput"

>


<!-- =========================
     VILLAGE
========================= -->

પ્રવાસમાં જવાનું ગામ
</label>

    type="text"

     VIDEO
========================= -->

🎬 Download Poster Video

</button>

========================= -->

     PROGRESS
========================= -->

>

Video તૈયાર થઈ રહ્યું છે...

</div>

</div>


</div>

    id="statusText">
</div>

Video માં poster + audio ની સંપૂર્ણ length રહેશે.

</div>


</div>


<!-- =========================
     POSTER
========================= -->

<div class="poster-wrapper">

<canvas
    id="posterCanvas"
    width="928"
    height="1640">
</canvas>

</div>


</div>


<script>


/* =========================================================
   SETTINGS
========================================================= */


/*
   Original poster size.
*/

const POSTER_WIDTH = 928;

const POSTER_HEIGHT = 1640;


/*
   Files in GitHub Pages folder.
*/

const POSTER_FILE = "poster.jpg";

const AUDIO_FILE = "audio.mp3";


/*
   IMPORTANT:

   Poster is static.

   Therefore 2 FPS is enough.

   This greatly reduces file size
   compared with 20 FPS.
*/

const VIDEO_FPS = 2;


/*
   Lower bitrate = smaller file
   and faster download.

   Audio remains high quality.
*/

const VIDEO_BITRATE = 650000;

const AUDIO_BITRATE = 96000;


/* =========================================================
   PHOTO POSITION
========================================================= */

const PHOTO_BOX = {

    x:638,

    y:1290,

    width:270,

    height:270

};


/* =========================================================
   NAME POSITION
========================================================= */

const NAME_POSITION = {

    x:773,

    y:1615,

    maxWidth:240,

    fontSize:48,

    minFontSize:25

};


/* =========================================================
   VILLAGE POSITION
========================================================= */

const VILLAGE_POSITION = {

    x:632,

    y:1095,

    width:280,

    height:45,

    fontSize:35,

    color:"#832404"

};


/* =========================================================
   ELEMENTS
========================================================= */

const canvas =
    document.getElementById(
        "posterCanvas"
    );


const ctx =
    canvas.getContext(
        "2d"
    );


const photoInput =
    document.getElementById(
        "photoInput"
    );


const nameInput =
    document.getElementById(
        "nameInput"
    );


const villageInput =
    document.getElementById(
        "villageInput"
    );


const downloadVideo =
    document.getElementById(
        "downloadVideo"
    );


const downloadPoster =
    document.getElementById(
        "downloadPoster"
    );


const progressBox =
    document.getElementById(
        "progressBox"
    );


const progressText =
    document.getElementById(
        "progressText"
    );


const progressFill =
    document.getElementById(
        "progressFill"
    );


const statusText =
    document.getElementById(
        "statusText"
    );


const videoInfo =
    document.getElementById(
        "videoInfo"
    );


/* =========================================================
   VARIABLES
========================================================= */

let posterImage = null;

let userPhoto = null;


/* =========================================================
   FONT
========================================================= */

async function loadFont(){

    try{

        if(document.fonts){

            await document.fonts.load(
                '35px "Mogra"'
            );

        }

    }
    catch(error){

        console.log(
            "Font warning:",
            error
        );

    }

}


/* =========================================================
   LOAD POSTER
========================================================= */

async function loadPoster(){

    const response =
        await fetch(
            POSTER_FILE +
            "?v=" +
            Date.now()
        );


    if(!response.ok){

        throw new Error(

            "poster.jpg not found.\n\n" +

            "Put poster.jpg in the same folder " +
            "as index.html."

        );

    }


    const blob =
        await response.blob();


    const url =
        URL.createObjectURL(
            blob
        );


    await new Promise(
        function(resolve,reject){

            const img =
                new Image();


            img.onload =
                function(){

                    posterImage =
                        img;


                    URL.revokeObjectURL(
                        url
                    );


                    redraw();


                    resolve();

                };


            img.onerror =
                function(){

                    URL.revokeObjectURL(
                        url
                    );


                    reject(
                        new Error(
                            "poster.jpg could not be loaded."
                        )
                    );

                };


            img.src =
                url;

        }
    );

}


/* =========================================================
   PHOTO UPLOAD
========================================================= */

photoInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file)
            return;


        if(
            !file.type.startsWith(
                "image/"
            )
        ){

            alert(
                "Please select an image."
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                const img =
                    new Image();


                img.onload =
                    function(){

                        userPhoto =
                            img;


                        redraw();

                    };


                img.src =
                    event.target.result;

            };


        reader.readAsDataURL(
            file
        );

    }
);


/* =========================================================
   INPUT EVENTS
========================================================= */

nameInput.addEventListener(
    "input",
    redraw
);


villageInput.addEventListener(
    "input",
    redraw
);


/* =========================================================
   DRAW PHOTO
========================================================= */

function drawPhoto(){

    if(!userPhoto)
        return;


    const boxX =
        PHOTO_BOX.x;


    const boxY =
        PHOTO_BOX.y;


    const boxW =
        PHOTO_BOX.width;


    const boxH =
        PHOTO_BOX.height;


    const imageRatio =
        userPhoto.width /
        userPhoto.height;


    const boxRatio =
        boxW /
        boxH;


    let drawW;

    let drawH;


    if(
        imageRatio >
        boxRatio
    ){

        drawW =
            boxW;


        drawH =
            drawW /
            imageRatio;

    }
    else{

        drawH =
            boxH;


        drawW =
            drawH *
            imageRatio;

    }


    const drawX =
        boxX +
        (
            boxW -
            drawW
        ) / 2;


    const drawY =
        boxY +
        (
            boxH -
            drawH
        ) / 2;


    ctx.save();


    ctx.beginPath();


    ctx.rect(

        boxX,

        boxY,

        boxW,

        boxH

    );


    ctx.clip();


    ctx.drawImage(

        userPhoto,

        drawX,

        drawY,

        drawW,

        drawH

    );


    ctx.restore();

}


/* =========================================================
   DRAW NAME
========================================================= */

function drawName(){

    const name =
        nameInput.value.trim();


    if(!name)
        return;


    let size =
        NAME_POSITION.fontSize;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        `bold ${size}px Arial`;


    while(

        ctx.measureText(
            name
        ).width >

        NAME_POSITION.maxWidth

        &&

        size >
        NAME_POSITION.minFontSize

    ){

        size--;


        ctx.font =
            `bold ${size}px Arial`;

    }


    ctx.fillStyle =
        "#8f2e0f";


    ctx.shadowColor =
        "rgba(0,0,0,.18)";


    ctx.shadowBlur =
        3;


    ctx.fillText(

        name,

        NAME_POSITION.x,

        NAME_POSITION.y

    );


    ctx.shadowBlur =
        0;

}


/* =========================================================
   DRAW VILLAGE
========================================================= */

function drawVillage(){

    const village =
        villageInput.value.trim();


    if(!village)
        return;


    ctx.save();


    let size =
        VILLAGE_POSITION.fontSize;


    ctx.textAlign =
        "center";


    ctx.textBaseline =
        "middle";


    ctx.font =
        `${size}px "Mogra", Arial, sans-serif`;


    while(

        ctx.measureText(
            village
        ).width >

        VILLAGE_POSITION.width

        &&

        size >
        20

    ){

        size--;


        ctx.font =
            `${size}px "Mogra", Arial, sans-serif`;

    }


    ctx.fillStyle =
        VILLAGE_POSITION.color;


    ctx.shadowColor =
        "rgba(0,0,0,.15)";


    ctx.shadowBlur =
        2;


    const centerX =
        VILLAGE_POSITION.x +
        VILLAGE_POSITION.width / 2;


    const centerY =
        VILLAGE_POSITION.y +
        VILLAGE_POSITION.height / 2;


    ctx.fillText(

        village,

        centerX,

        centerY

    );


    ctx.restore();

}


/* =========================================================
   REDRAW
========================================================= */

function redraw(){

    if(!posterImage)
        return;


    ctx.clearRect(

        0,

        0,

        POSTER_WIDTH,

        POSTER_HEIGHT

    );


    /*
       Original poster.
    */

    ctx.drawImage(

        posterImage,

        0,

        0,

        POSTER_WIDTH,

        POSTER_HEIGHT

    );


    /*
       Visitor photo.
    */

    drawPhoto();


    /*
       Village.
    */

    drawVillage();


    /*
       Name.
    */

    drawName();

}


/* =========================================================
   DOWNLOAD IMAGE
========================================================= */

downloadPoster.addEventListener(
    "click",
    function(){

        redraw();


        canvas.toBlob(
            function(blob){

                if(!blob){

                    alert(
                        "Poster image could not be created."
                    );

                    return;

                }


                downloadBlob(

                    blob,

                    "personalised-poster.png"

                );

            },

            "image/png"

        );

    }
);


/* =========================================================
   LOAD AUDIO
========================================================= */

async function loadAudio(){

    const response =
        await fetch(

            AUDIO_FILE +
            "?v=" +
            Date.now()

        );


    if(!response.ok){

        throw new Error(

            "audio.mp3 not found.\n\n" +

            "Put audio.mp3 in the same folder " +
            "as index.html."

        );

    }


    const arrayBuffer =
        await response.arrayBuffer();


    const AudioContextClass =
        window.AudioContext ||
        window.webkitAudioContext;


    if(!AudioContextClass){

        throw new Error(

            "Web Audio is not supported " +
            "by this browser."

        );

    }


    const audioContext =
        new AudioContextClass();


    const audioBuffer =
        await audioContext.decodeAudioData(

            arrayBuffer

        );


    return {

        audioContext,

        audioBuffer

    };

}


/* =========================================================
   RECORDING FORMAT
========================================================= */

function getRecordingFormat(){

    /*
       Safari prefers MP4.
    */

    const mp4Formats = [

        'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

        'video/mp4;codecs="avc1.4D401E,mp4a.40.2"',

        "video/mp4"

    ];


    for(
        const type of mp4Formats
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return {

                mimeType:
                    type,

                extension:
                    "mp4"

            };

        }

    }


    /*
       Chrome normally uses WebM.
    */

    const webmFormats = [

        'video/webm;codecs="vp9,opus"',

        'video/webm;codecs="vp8,opus"',

        "video/webm"

    ];


    for(
        const type of webmFormats
    ){

        if(
            MediaRecorder.isTypeSupported(
                type
            )
        ){

            return {

                mimeType:
                    type,

                extension:
                    "webm"

            };

        }

    }


    return null;

}


/* =========================================================
   TIME FORMAT
========================================================= */

function formatTime(seconds){

    const total =
        Math.round(
            seconds
        );


    const minutes =
        Math.floor(
            total / 60
        );


    const secs =
        total % 60;


    return (

        String(minutes)
        .padStart(2,"0")

        +

        ":" +

        String(secs)
        .padStart(2,"0")

    );

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                ms
            );

        }
    );

}


/* =========================================================
   CREATE VIDEO
========================================================= */

async function createVideo(){

    /* =========================
       VALIDATION
    ========================= */

    if(!userPhoto){

        alert(
            "Please upload your photo first."
        );

        return;

    }


    if(
        !nameInput.value.trim()
    ){

        alert(
            "Please enter your name."
        );

        return;

    }


    if(
        !villageInput.value.trim()
    ){

        alert(
            "Please enter the village name."
        );

        return;

    }


    if(
        typeof MediaRecorder ===
        "undefined"
    ){

        alert(

            "Your browser does not support " +
            "video recording."

        );

        return;

    }


    const format =
        getRecordingFormat();


    if(!format){

        alert(

            "This browser cannot create " +
            "a downloadable video."

        );

        return;

    }


    /* =========================
       UI
    ========================= */

    downloadVideo.disabled =
        true;


    downloadPoster.disabled =
        true;


    progressBox.style.display =
        "block";


    progressFill.style.width =
        "0%";


    progressText.innerText =
        "Audio તૈયાર થઈ રહ્યું છે...";


    videoInfo.innerText =
        "";


    let audioContext = null;

    let audioBuffer = null;

    let source = null;

    let canvasStream = null;

    let recorder = null;

    let animationTimer = null;


    try{

        /* =========================
           LOAD AUDIO
        ========================= */

        const audio =
            await loadAudio();


        audioContext =
            audio.audioContext;


        audioBuffer =
            audio.audioBuffer;


        const duration =
            audioBuffer.duration;


        if(
            !duration ||
            duration <= 0
        ){

            throw new Error(
                "Audio duration could not be determined."
            );

        }


        videoInfo.innerText =

            `Audio: ${formatTime(duration)} | ` +

            `Format: ${format.extension.toUpperCase()} | ` +

            `Video: ${VIDEO_FPS} FPS`;


        /* =========================
           FINAL POSTER
        ========================= */

        redraw();


        /* =========================
           CANVAS VIDEO
        ========================= */


        /*
           Only 2 FPS.

           The poster is static,
           so 20 FPS is unnecessary.
        */

        canvasStream =
            canvas.captureStream(
                VIDEO_FPS
            );


        /* =========================
           AUDIO STREAM
        ========================= */

        const audioDestination =
            audioContext
            .createMediaStreamDestination();


        source =
            audioContext
            .createBufferSource();


        source.buffer =
            audioBuffer;


        source.connect(
            audioDestination
        );


        await audioContext.resume();


        /* =========================
           COMBINE STREAMS
        ========================= */

        const finalStream =
            new MediaStream();


        canvasStream
            .getVideoTracks()
            .forEach(
                function(track){

                    finalStream.addTrack(
                        track
                    );

                }
            );


        audioDestination
            .stream
            .getAudioTracks()
            .forEach(
                function(track){

                    finalStream.addTrack(
                        track
                    );

                }
            );


        /* =========================
           RECORDER
        ========================= */

        recorder =
            new MediaRecorder(

                finalStream,

                {

                    mimeType:
                        format.mimeType,

                    videoBitsPerSecond:
                        VIDEO_BITRATE,

                    audioBitsPerSecond:
                        AUDIO_BITRATE

                }

            );


        const chunks = [];


        recorder.ondataavailable =
            function(event){

                if(

                    event.data &&

                    event.data.size > 0

                ){

                    chunks.push(
                        event.data
                    );

                }

            };


        const stopped =
            new Promise(
                function(resolve,reject){

                    recorder.onstop =
                        resolve;


                    recorder.onerror =
                        function(event){

                            reject(

                                event.error ||

                                new Error(
                                    "Video recording failed."
                                )

                            );

                        };

                }
            );


        /* =========================
           IMPORTANT ORDER
        ========================= */


        /*
           1. Start recorder FIRST.
        */

        recorder.start(1000);


        /*
           2. Wait a little.
        */

        await sleep(300);


        /*
           3. Start audio.
        */

        source.start(0);


        /*
           Force canvas frames.

           This is important for
           Safari/Chrome because the
           poster itself is static.
        */

        animationTimer =
            setInterval(
                function(){

                    redraw();

                },
                1000 / VIDEO_FPS
            );


        /* =========================
           WAIT FULL AUDIO
        ========================= */

        const startTime =
            performance.now();


        await new Promise(
            function(resolve){

                function update(){

                    const elapsed =

                        (
                            performance.now()
                            -
                            startTime
                        ) / 1000;


                    const percentage =

                        Math.min(

                            100,

                            (
                                elapsed /
                                duration
                            ) * 100

                        );


                    progressFill.style.width =
                        percentage + "%";


                    progressText.innerText =

                        `Video બનાવાઈ રહ્યું છે... ` +

                        `${Math.floor(percentage)}%`;



                    if(
                        elapsed >= duration
                    ){

                        resolve();

                    }
                    else{

                        requestAnimationFrame(
                            update
                        );

                    }

                }


                update();

            }
        );


        /* =========================
           FINAL BUFFER
        ========================= */

        await sleep(400);


        /* =========================
           STOP FRAME TIMER
        ========================= */

        if(animationTimer){

            clearInterval(
                animationTimer
            );

            animationTimer =
                null;

        }


        /* =========================
           STOP AUDIO
        ========================= */

        try{

            source.stop();

        }
        catch(error){}


        /*
           Give audio track time to finish.
        */

        await sleep(150);


        /* =========================
           STOP RECORDER
        ========================= */

        recorder.stop();


        /*
           VERY IMPORTANT:

           Wait until browser has
           completely finalized
           the video file.
        */

        await stopped;


        /* =========================
           CREATE BLOB
        ========================= */

        const videoBlob =
            new Blob(

                chunks,

                {

                    type:
                        recorder.mimeType ||
                        format.mimeType

                }

            );


        if(
            !videoBlob ||
            videoBlob.size === 0
        ){

            throw new Error(

                "Browser did not create " +
                "a video file."

            );

        }


        /* =========================
           FINISHED
        ========================= */

        progressFill.style.width =
            "100%";


        progressText.innerText =
            "✅ Video તૈયાર છે";


        videoInfo.innerText =

            `Complete video: ` +

            `${formatTime(duration)} | ` +

            `File size: ` +

            formatFileSize(
                videoBlob.size
            );


        /*
           Download correct format.
        */

        downloadBlob(

            videoBlob,

            "personalised-poster-video." +
            format.extension

        );


    }
    catch(error){

        console.error(
            "VIDEO ERROR:",
            error
        );


        alert(

            "Video બનાવવામાં error આવ્યો:\n\n" +

            error.message

        );

    }
    finally{

        /* =========================
           CLEANUP
        ========================= */

        if(animationTimer){

            clearInterval(
                animationTimer
            );

        }


        if(source){

            try{

                source.disconnect();

            }
            catch(error){}

        }


        if(canvasStream){

            canvasStream
                .getTracks()
                .forEach(
                    function(track){

                        track.stop();

                    }
                );

        }


        if(audioContext){

            try{

                await audioContext.close();

            }
            catch(error){}

        }


        downloadVideo.disabled =
            false;


        downloadPoster.disabled =
            false;


        setTimeout(
            function(){

                progressBox.style.display =
                    "none";

            },
            5000
        );

    }

}


/* =========================================================
   FILE SIZE
========================================================= */

function formatFileSize(bytes){

    if(bytes < 1024){

        return bytes + " B";

    }


    if(bytes < 1024 * 1024){

        return (

            (bytes / 1024)
            .toFixed(1)

            +

            " KB"

        );

    }


    return (

        (bytes / 1024 / 1024)
        .toFixed(1)

        +

        " MB"

    );

}


/* =========================================================
   DOWNLOAD
========================================================= */

function downloadBlob(
    blob,
    filename
){

    const url =
        URL.createObjectURL(
            blob
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        url;


    link.download =
        filename;


    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    /*
       Trigger download.
    */

    link.click();


    document.body.removeChild(
        link
    );


    /*
       Keep Blob URL alive longer
       for Safari.
    */

    setTimeout(
        function(){

            URL.revokeObjectURL(
                url
            );

        },
        60000
    );

}


/* =========================================================

downloadVideo.addEventListener(

    createVideo
);
